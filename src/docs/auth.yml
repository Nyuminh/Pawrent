tags:
  - name: Auth
    description: Xác thực và tài khoản
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      description: |
        Đăng ký tài khoản mới cho người dùng hoặc bác sĩ thú y.
        
        **Người dùng thường (role: user):**
        - Chỉ cần: fullName, email, password
        
        **Bác sĩ thú y (role: vet):**
        - Cung cấp tất cả thông tin chuyên môn cùng lúc (nếu có, bắt buộc: licenseNumber, specializations, yearsOfExperience, clinic.name)
        - Hồ sơ sẽ chờ admin xác minh
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A
                email:
                  type: string
                  example: user@example.com
                phone:
                  type: string
                  example: "0901234567"
                password:
                  type: string
                  example: "123456"
                role:
                  type: string
                  enum: [user, vet]
                  default: user
                  description: "Vai trò: user (người nuôi thú cưng) hoặc vet (bác sĩ thú y)"
                licenseNumber:
                  type: string
                  description: "Bắt buộc nếu role = vet. Số giấy phép hành nghề"
                  example: "DV-2024-001234"
                specializations:
                  type: array
                  description: "Bắt buộc nếu role = vet. Danh sách chuyên môn"
                  items:
                    type: string
                  example: ["general", "surgery"]
                yearsOfExperience:
                  type: number
                  description: "Bắt buộc nếu role = vet. Số năm kinh nghiệm"
                  example: 5
                clinic:
                  type: object
                  description: "Bắt buộc nếu role = vet. Thông tin phòng khám"
                  properties:
                    name:
                      type: string
                      description: "Tên phòng khám (bắt buộc)"
                      example: "Phòng khám thú cưng Hà Nội"
                    address:
                      type: object
                      description: "Địa chỉ phòng khám (bắt buộc street, city)"
                      properties:
                        street:
                          type: string
                          description: "Đường/số nhà (bắt buộc)"
                        city:
                          type: string
                          description: "Thành phố (bắt buộc)"
                        district:
                          type: string
                          description: "Quận/Huyện"
                        ward:
                          type: string
                          description: "Phường/Xã"
                    phone:
                      type: string
                      description: "Số điện thoại phòng khám (bắt buộc, khác với phone cá nhân)"
                      example: "0243456789"
                speciesExpertise:
                  type: array
                  description: "Tùy chọn. Các loài thú cưng chuyên gia"
                  items:
                    type: string
                isAvailableOnline:
                  type: boolean
                  description: "Tùy chọn. Có khám tuyến trực tuyến không"
                  default: false
                bio:
                  type: string
                  description: "Tùy chọn. Tiểu sử/giới thiệu bản thân"
                consultationFee:
                  type: object
                  description: "Tùy chọn. Phí khám chữa"
                  properties:
                    inPerson:
                      type: number
                    online:
                      type: number
            examples:
              user_registration:
                summary: "Đăng ký người dùng thường"
                value:
                  fullName: "Trần Thị B"
                  email: "user@example.com"
                  password: "123456"
              vet_registration:
                summary: "Đăng ký bác sĩ thú y"
                value:
                  fullName: "Nguyễn Văn A"
                  email: "vet@example.com"
                  password: "123456"
                  phone: "0901234567"
                  role: "vet"
                  licenseNumber: "DV-2024-001234"
                  specializations: ["general", "surgery"]
                  yearsOfExperience: 5
                  clinic:
                    name: "Phòng khám thú cưng Hà Nội"
                    address:
                      street: "123 Đường Tây Sơn"
                      city: "Hà Nội"
                      district: "Đống Đa"
                    phone: "0243456789"
                  speciesExpertise: ["dog", "cat"]
                  isAvailableOnline: true
      responses:
        201:
          description: Đăng ký thành công
        400:
          description: Yêu cầu không hợp lệ
        409:
          description: Email hoặc licenseNumber đã tồn tại

  /auth/register-hotel-owner:
    post:
      summary: Đăng ký chủ khách sạn thú cưng
      description: |
        Đăng ký tài khoản chủ khách sạn thú cưng và tạo khách sạn ban đầu.
        
        Endpoint này sẽ:
        1. Tạo tài khoản người dùng với role = hotel_owner
        2. Tạo khách sạn ban đầu liên kết với tài khoản
        3. Trả về token để sử dụng ngay
        
        Khách sạn được tạo sẽ ở trạng thái active nhưng chưa verified. Chủ khách sạn có thể thêm phòng, dịch vụ, hình ảnh sau.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, hotelName, hotelDescription, address]
              properties:
                # User account info
                fullName:
                  type: string
                  description: Tên chủ khách sạn
                  example: Nguyễn Văn B
                email:
                  type: string
                  description: Email tài khoản (dùng để đăng nhập)
                  example: hotelowner@example.com
                phone:
                  type: string
                  description: Số điện thoại chủ khách sạn
                  example: "0901234567"
                password:
                  type: string
                  description: Mật khẩu (tối thiểu 6 ký tự)
                  example: "123456"
                # Hotel info
                hotelName:
                  type: string
                  description: Tên khách sạn
                  example: "Happy Pet Hotel"
                hotelDescription:
                  type: string
                  description: Mô tả khách sạn (tối thiểu 20 ký tự)
                  example: "Khách sạn thú cưng cao cấp với dịch vụ chăm sóc chuyên nghiệp 24/7"
                hotelPhone:
                  type: string
                  description: "Tùy chọn. Số điện thoại khách sạn (nếu khác với phone cá nhân)"
                  example: "0212345678"
                hotelEmail:
                  type: string
                  description: "Tùy chọn. Email khách sạn (nếu khác với email cá nhân)"
                  example: "info@happypethotel.com"
                address:
                  type: object
                  description: Địa chỉ khách sạn
                  required: [street, city]
                  properties:
                    street:
                      type: string
                      description: "Đường/số nhà (bắt buộc)"
                      example: "123 Đường Trần Hưng Đạo"
                    city:
                      type: string
                      description: "Thành phố (bắt buộc)"
                      example: "Hà Nội"
                    district:
                      type: string
                      description: "Quận/Huyện"
                      example: "Hoàn Kiếm"
                    ward:
                      type: string
                      description: "Phường/Xã"
                      example: "Tràng Tiền"
                acceptedPets:
                  type: array
                  description: "Tùy chọn. Các loại thú cưng được chấp nhận"
                  items:
                    type: string
                    enum: [dog, cat, bird, hamster, rabbit, other]
                  default: ["dog", "cat"]
                  example: ["dog", "cat", "bird"]
      responses:
        201:
          description: Đăng ký thành công, khách sạn đã được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Đăng ký chủ khách sạn thú cưng thành công! Khách sạn đã được tạo."
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        description: Thông tin người dùng
                        properties:
                          _id:
                            type: string
                            example: "507f1f77bcf86cd799439011"
                          fullName:
                            type: string
                          email:
                            type: string
                          phone:
                            type: string
                          role:
                            type: string
                            example: "hotel_owner"
                      hotel:
                        type: object
                        description: Thông tin khách sạn được tạo
                        properties:
                          hotelId:
                            type: string
                            example: "507f1f77bcf86cd799439012"
                          name:
                            type: string
                          slug:
                            type: string
                            description: "Slug dùng cho URL"
                      accessToken:
                        type: string
                        description: JWT access token
                      refreshToken:
                        type: string
                        description: JWT refresh token
                      tokenType:
                        type: string
                        example: "Bearer"
                      expiresIn:
                        type: string
                        example: "24h"
        400:
          description: Yêu cầu không hợp lệ (thiếu trường, dữ liệu không hợp lệ)
        409:
          description: Email đã tồn tại
  /auth/login:
    post:
      summary: Đăng nhập
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Đăng nhập thành công
        401:
          description: Email hoặc mật khẩu không chính xác
  /auth/refresh-token:
    post:
      summary: Làm mới token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Cấp token mới thành công
  /auth/logout:
    post:
      summary: Đăng xuất
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Đăng xuất thành công
  /auth/me:
    get:
      summary: Lấy thông tin cá nhân
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thông tin user
  /auth/profile:
    put:
      summary: Cập nhật thông tin cá nhân
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  description: Họ tên
                phone:
                  type: string
                  description: Số điện thoại
                avatar:
                  type: string
                  format: binary
                  description: Ảnh đại diện (JPEG, PNG, GIF, WebP - tối đa 5MB)
                address:
                  type: object
                  description: Địa chỉ
                  properties:
                    street:
                      type: string
                      description: Đường/số nhà
                    city:
                      type: string
                      description: Thành phố
                    district:
                      type: string
                      description: Quận/Huyện
                    ward:
                      type: string
                      description: Phường/Xã
      responses:
        200:
          description: Cập nhật thành công
  /auth/change-password:
    put:
      summary: Đổi mật khẩu
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Đổi mật khẩu thành công
