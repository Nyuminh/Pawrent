tags:
  - name: Admin
    description: Quản lý hệ thống và người dùng (yêu cầu role admin)

paths:
  /admin/dashboard:
    get:
      summary: Thống kê dashboard admin
      description: Lấy thông tin thống kê hệ thống (tổng số người dùng, thú cưng, bác sĩ, khách sạn, doanh thu, v.v.)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties:
                          total:
                            type: integer
                          premium:
                            type: integer
                      pets:
                        type: integer
                      appointments:
                        type: integer
                      bookings:
                        type: integer
                      revenue:
                        type: object
        401:
          description: Chưa xác thực
        403:
          description: Không có quyền (không phải admin)

  /admin/users:
    get:
      summary: Danh sách tất cả người dùng
      description: Lấy danh sách tất cả người dùng trong hệ thống (có phân trang và tìm kiếm)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [user, vet, hotel_owner, admin]
          description: Lọc theo vai trò
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo tên hoặc email
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng trên 1 trang
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        fullName:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        role:
                          type: string
                        avatar:
                          type: string
                        createdAt:
                          type: string
                          format: date-time

  /admin/users/{id}:
    put:
      summary: Cập nhật người dùng
      description: Cập nhật thông tin người dùng (role, trạng thái hoạt động)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, vet, hotel_owner, admin]
                  description: Vai trò mới
                isActive:
                  type: boolean
                  description: Trạng thái hoạt động
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        404:
          description: Không tìm thấy người dùng
        403:
          description: Không có quyền

    delete:
      summary: Xóa người dùng
      description: Xóa người dùng khỏi hệ thống
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID người dùng
      responses:
        200:
          description: Xóa thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: Không tìm thấy người dùng
        403:
          description: Không có quyền
