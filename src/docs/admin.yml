tags:
  - name: Admin
    description: Quản lý hệ thống và người dùng (yêu cầu role admin)

paths:
  /admin/dashboard:
    get:
      summary: Thống kê dashboard admin
      description: Lấy thông tin thống kê hệ thống (tổng số người dùng, thú cưng, bác sĩ, khách sạn, doanh thu, v.v.)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties:
                          total:
                            type: integer
                          premium:
                            type: integer
                      pets:
                        type: integer
                      appointments:
                        type: integer
                      bookings:
                        type: integer
                      revenue:
                        type: object
        401:
          description: Chưa xác thực
        403:
          description: Không có quyền (không phải admin)

  /admin/users:
    get:
      summary: Danh sách tất cả người dùng
      description: Lấy danh sách tất cả người dùng trong hệ thống (có phân trang và tìm kiếm)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [user, vet, hotel_owner, admin]
          description: Lọc theo vai trò
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo tên hoặc email
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng trên 1 trang
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        fullName:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        role:
                          type: string
                        avatar:
                          type: string
                        createdAt:
                          type: string
                          format: date-time

  /admin/users/{id}:
    put:
      summary: Cập nhật người dùng
      description: Cập nhật thông tin người dùng (role, trạng thái hoạt động)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, vet, hotel_owner, admin]
                  description: Vai trò mới
                isActive:
                  type: boolean
                  description: Trạng thái hoạt động
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        404:
          description: Không tìm thấy người dùng
        403:
          description: Không có quyền

    delete:
      summary: Xóa người dùng
      description: Xóa người dùng khỏi hệ thống
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID người dùng
      responses:
        200:
          description: Xóa thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        404:
          description: Không tìm thấy người dùng
        403:
          description: Không có quyền

  /admin/users/{id}/subscription:
    put:
      summary: Cập nhật gói subscription của người dùng
      description: Cập nhật thông tin gói subscription (plan, trạng thái, hạn ngày, số pet tối đa)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  description: Mã gói subscription (ví dụ free, pawrent_plus, pawrent_vip)
                name:
                  type: string
                  description: Tên hiển thị gói subscription
                durationUnit:
                  type: string
                  enum: [month, year]
                  description: Chu kỳ sử dụng của gói
                isActive:
                  type: boolean
                  description: Trạng thái hoạt động của gói
                maxPets:
                  type: integer
                  minimum: 0
                  description: Số thú cưng tối đa cho gói này
                startDate:
                  type: string
                  format: date-time
                  description: Ngày bắt đầu gói (ISO 8601 format)
                  example: "2024-01-01T00:00:00Z"
                endDate:
                  type: string
                  format: date-time
                  description: Ngày kết thúc gói (ISO 8601 format)
                  example: "2024-12-31T23:59:59Z"
            examples:
              update_to_premium:
                summary: "Nâng cấp lên Premium 1 năm"
                value:
                  plan: "premium"
                  isActive: true
                  maxPets: 5
                  startDate: "2024-01-01T00:00:00Z"
                  endDate: "2024-12-31T23:59:59Z"
              downgrade_to_free:
                summary: "Hạ cấp xuống Free"
                value:
                  plan: "free"
                  isActive: true
                  maxPets: 1
      responses:
        200:
          description: Cập nhật gói subscription thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string
                      subscription:
                        type: object
                        properties:
                          plan:
                            type: string
                          isActive:
                            type: boolean
                          maxPets:
                            type: integer
                          startDate:
                            type: string
                            format: date-time
                          endDate:
                            type: string
                            format: date-time
        400:
          description: Dữ liệu không hợp lệ
        404:
          description: Không tìm thấy người dùng
        403:
          description: Không có quyền

  /admin/pets:
    get:
      summary: Danh sách tất cả thú cưng
      description: Lấy danh sách tất cả thú cưng trong hệ thống (có phân trang, lọc và sắp xếp)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          schema:
            type: string
            enum: [dog, cat, bird, hamster, rabbit, fish, other]
          description: Lọc theo loài thú cưng
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Lọc theo trạng thái (active/inactive)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng thú cưng trên 1 trang
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                    description: Số thú cưng trên trang hiện tại
                  total:
                    type: integer
                    description: Tổng số thú cưng trong hệ thống
                  page:
                    type: integer
                  pages:
                    type: integer
                    description: Tổng số trang
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                          description: Tên thú cưng
                        species:
                          type: string
                          enum: [dog, cat, bird, hamster, rabbit, fish, other]
                        breed:
                          type: string
                        gender:
                          type: string
                          enum: [male, female, unknown]
                        age:
                          type: number
                        weight:
                          type: number
                        avatar:
                          type: string
                        isActive:
                          type: boolean
                        owner:
                          type: object
                          properties:
                            _id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            phone:
                              type: string
                        createdAt:
                          type: string
                          format: date-time
        401:
          description: Chưa xác thực
        403:
          description: Không có quyền (không phải admin)
