tags:
  - name: Vets & Appointments
    description: Bác sĩ thú y và Đặt lịch khám
paths:
  /vets:
    get:
      summary: Danh sách bác sĩ thú y
      tags: [Vets & Appointments]
      responses:
        200:
          description: Thành công
  /vets/{id}:
    get:
      summary: Chi tiết chuyên gia/bác sĩ
      tags: [Vets & Appointments]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
  /vets/profile:
    put:
      summary: Cập nhật hồ sơ bác sĩ thú y
      description: |
        Cập nhật thông tin hồ sơ bác sĩ thú y (sau khi đã đăng ký).
        Chỉ bác sĩ thú y (role: vet) có thể cập nhật hồ sơ của mình.
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                specializations:
                  type: array
                  items:
                    type: string
                yearsOfExperience:
                  type: number
                clinic:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: object
                    phone:
                      type: string
                speciesExpertise:
                  type: array
                  items:
                    type: string
                isAvailableOnline:
                  type: boolean
                bio:
                  type: string
                consultationFee:
                  type: object
                  properties:
                    inPerson:
                      type: number
                    online:
                      type: number
      responses:
        200:
          description: Cập nhật thành công
        401:
          description: Chưa xác thực
        403:
          description: Không có quyền (không phải role 'vet')
        404:
          description: Không tìm thấy hồ sơ bác sĩ
  /appointments:
    get:
      summary: Lịch hẹn của tôi
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled, no_show]
          description: Lọc theo trạng thái
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng trên 1 trang
      responses:
        200:
          description: Thành công
    post:
      summary: Đặt lịch khám
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet, vet, appointmentType, date, reason]
              properties:
                pet:
                  type: string
                  description: ID thú cưng (bắt buộc)
                vet:
                  type: string
                  description: ID bác sĩ thú y (bắt buộc)
                appointmentType:
                  type: string
                  enum: [in_person, online]
                  description: Hình thức khám (bắt buộc)
                date:
                  type: string
                  format: date
                  description: Ngày khám (YYYY-MM-DD, bắt buộc)
                timeSlot:
                  type: object
                  description: Khung giờ khám (bắt buộc)
                  required: [startTime]
                  properties:
                    startTime:
                      type: string
                      description: Giờ bắt đầu (HH:mm)
                    endTime:
                      type: string
                      description: Giờ kết thúc (HH:mm)
                reason:
                  type: string
                  description: Lý do khám (bắt buộc)
                symptoms:
                  type: array
                  items:
                    type: string
                  description: Các triệu chứng
                notes:
                  type: string
                  description: Ghi chú thêm
      responses:
        201:
          description: Đặt lịch thành công
  /appointments/all:
    get:
      summary: Danh sách tất cả lịch hẹn (admin)
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled, no_show]
          description: Lọc theo trạng thái
        - name: vet
          in: query
          schema:
            type: string
          description: ID bác sĩ thú y
        - name: user
          in: query
          schema:
            type: string
          description: ID người dùng
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Lọc theo ngày (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số lượng trên 1 trang
      responses:
        200:
          description: Thành công
  /appointments/{id}/status:
    put:
      summary: Cập nhật trạng thái lịch hẹn
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID lịch hẹn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, in_progress, completed, cancelled, no_show]
                  description: Trạng thái mới (bắt buộc)
                reason:
                  type: string
                  description: Lý do (nếu hủy/không đến)
      responses:
        200:
          description: Cập nhật trạng thái thành công
  /appointments/{id}/review:
    post:
      summary: Đánh giá lịch hẹn
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID lịch hẹn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  description: Xếp hạng (1-5 sao)
                comment:
                  type: string
                  description: Nhận xét/bình luận
      responses:
        201:
          description: Đánh giá đã lưu
  /appointments/{id}:
    delete:
      summary: Xóa lịch hẹn
      description: |
        Xóa lịch hẹn của người dùng.
        Chỉ có thể xóa lịch hẹn đang ở trạng thái 'pending' hoặc 'confirmed'.
        Chỉ chủ nhân lịch hẹn hoặc admin có thể xóa.
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID lịch hẹn
      responses:
        200:
          description: Xóa lịch hẹn thành công
        403:
          description: Không có quyền xóa lịch hẹn này
        404:
          description: Không tìm thấy lịch hẹn
        400:
          description: Không thể xóa lịch hẹn ở trạng thái này
