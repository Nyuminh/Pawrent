tags:
  - name: Vets & Appointments
    description: Bác sĩ thú y và Đặt lịch khám
paths:
  /vets:
    get:
      summary: Danh sách bác sĩ thú y
      tags: [Vets & Appointments]
      responses:
        200:
          description: Thành công
  /vets/{id}:
    get:
      summary: Chi tiết chuyên gia/bác sĩ
      tags: [Vets & Appointments]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
  /vets/profile:
    put:
      summary: Cập nhật hồ sơ bác sĩ thú y
      description: |
        Cập nhật thông tin hồ sơ bác sĩ thú y (sau khi đã đăng ký).
        Chỉ bác sĩ thú y (role: vet) có thể cập nhật hồ sơ của mình.
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                specializations:
                  type: array
                  items:
                    type: string
                yearsOfExperience:
                  type: number
                clinic:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: object
                    phone:
                      type: string
                speciesExpertise:
                  type: array
                  items:
                    type: string
                isAvailableOnline:
                  type: boolean
                bio:
                  type: string
                consultationFee:
                  type: object
                  properties:
                    inPerson:
                      type: number
                    online:
                      type: number
      responses:
        200:
          description: Cập nhật thành công
        401:
          description: Chưa xác thực
        403:
          description: Không có quyền (không phải role 'vet')
        404:
          description: Không tìm thấy hồ sơ bác sĩ
  /appointments:
    get:
      summary: Lịch hẹn của tôi
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
    post:
      summary: Đặt lịch khám
      tags: [Vets & Appointments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pet:
                  type: string
                vet:
                  type: string
                appointmentType:
                  type: string
                  enum: [in_person, online]
                date:
                  type: string
                  format: date-time
                timeSlot:
                  type: object
                reason:
                  type: string
      responses:
        201:
          description: Đặt lịch thành công
