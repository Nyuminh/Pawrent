tags:
  - name: Payments
    description: Thanh toán MoMo và kiểm tra trạng thái thanh toán

paths:
  /payments/momo/create:
    post:
      summary: Tạo thanh toán MoMo và trả QR
      description: Tạo payment pending, gọi MoMo sandbox/production và trả về `payUrl` và `qrDataUrl` để quét.
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  example: 10000
                  description: Số tiền thanh toán (VND)
                orderInfo:
                  type: string
                  example: Thanh toán đơn hàng test
                  description: Nội dung thanh toán hiển thị trong MoMo
                metadata:
                  type: object
                  description: Dữ liệu bổ sung để lưu cùng payment
      responses:
        201:
          description: Tạo thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  paymentId:
                    type: string
                  payUrl:
                    type: string
                    description: URL mở thanh toán MoMo
                  qrDataUrl:
                    type: string
                    description: Data URL của QR code để hiển thị lên frontend
        400:
          description: Số tiền không hợp lệ
        401:
          description: Không được xác thực
        500:
          description: Không thể tạo payment tại MoMo

  /payments/momo/webhook:
    post:
      summary: Webhook MoMo nhận kết quả thanh toán
      description: Endpoint MoMo gọi về để báo kết quả giao dịch. Không cần đăng nhập.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  example: pawrent_66c1d1d5f2a7b30012ab1234
                requestId:
                  type: string
                  example: req_1716440000000
                resultCode:
                  type: integer
                  example: 0
                amount:
                  type: number
                  example: 10000
                signature:
                  type: string
                  description: Chữ ký MoMo dùng để verify
      responses:
        200:
          description: Đã nhận webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        400:
          description: Webhook không hợp lệ
