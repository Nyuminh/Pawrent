tags:
  - name: Hotels & Bookings
    description: Khách sạn thú cưng và Dịch vụ đặt phòng
  - name: AI Chatbot & Activity
    description: AI Tư vấn sức khỏe tự động
paths:
  /hotels:
    get:
      summary: Danh sách khách sạn thú cưng
      tags: [Hotels & Bookings]
      parameters:
        - name: city
          in: query
          description: Tìm kiếm theo thành phố
          schema:
            type: string
        - name: petType
          in: query
          description: Loại thú cưng (dog, cat, bird, hamster, rabbit, other)
          schema:
            type: string
        - name: minRating
          in: query
          description: Xếp hạng tối thiểu (0-5)
          schema:
            type: number
        - name: minPrice
          in: query
          description: Giá tối thiểu (VND/đêm)
          schema:
            type: number
        - name: maxPrice
          in: query
          description: Giá tối đa (VND/đêm)
          schema:
            type: number
        - name: sortBy
          in: query
          description: Sắp xếp theo (-rating.average, price, etc)
          schema:
            type: string
            default: '-rating.average'
        - name: page
          in: query
          description: Số trang
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số lượng khách sạn trên 1 trang
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Thành công
    post:
      summary: Đăng ký khách sạn (dành cho Hotel Owner)
      tags: [Hotels & Bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - address
                - phone
              properties:
                name:
                  type: string
                  description: Tên khách sạn
                description:
                  type: string
                  description: Mô tả khách sạn (tối đa 2000 ký tự)
                phone:
                  type: string
                  description: Số điện thoại liên hệ
                email:
                  type: string
                  description: Email liên hệ
                address:
                  type: object
                  required:
                    - street
                    - city
                  properties:
                    street:
                      type: string
                      description: Đường/số nhà
                    city:
                      type: string
                      description: Thành phố
                    district:
                      type: string
                      description: Quận/Huyện
                    ward:
                      type: string
                      description: Phường/Xã
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      price:
                        type: number
                      currency:
                        type: string
                        default: VND
                  description: Danh sách dịch vụ cung cấp
                rooms:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [standard, deluxe, vip, suite]
                      name:
                        type: string
                      description:
                        type: string
                      pricePerNight:
                        type: number
                      capacity:
                        type: number
                        description: Số thú cưng tối đa trên phòng
                      totalRooms:
                        type: number
                      availableRooms:
                        type: number
                      amenities:
                        type: array
                        items:
                          type: string
                  description: Các loại phòng
                images:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                      caption:
                        type: string
                  description: Hình ảnh khách sạn
                operatingHours:
                  type: object
                  properties:
                    checkIn:
                      type: string
                      description: Giờ check-in (HH:mm)
                    checkOut:
                      type: string
                      description: Giờ check-out (HH:mm)
                    isOpen24h:
                      type: boolean
                policies:
                  type: object
                  properties:
                    cancellationHours:
                      type: number
                      default: 24
                      description: Số giờ trước đó để hủy
                    requireVaccination:
                      type: boolean
                      default: true
                    maxPetWeight:
                      type: number
                      description: Cân nặng tối đa của thú cưng (kg)
                    additionalNotes:
                      type: string
      responses:
        201:
          description: Đăng ký thành công
  /hotels/{id}:
    put:
      summary: Cập nhật thông tin khách sạn
      tags: [Hotels & Bookings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID của khách sạn cần cập nhật
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tên khách sạn
                description:
                  type: string
                  description: Mô tả khách sạn (tối đa 2000 ký tự)
                phone:
                  type: string
                  description: Số điện thoại liên hệ
                email:
                  type: string
                  description: Email liên hệ
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    district:
                      type: string
                    ward:
                      type: string
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      price:
                        type: number
                      currency:
                        type: string
                rooms:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [standard, deluxe, vip, suite]
                      name:
                        type: string
                      description:
                        type: string
                      pricePerNight:
                        type: number
                      capacity:
                        type: number
                      totalRooms:
                        type: number
                      availableRooms:
                        type: number
                      amenities:
                        type: array
                        items:
                          type: string
                images:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                      caption:
                        type: string
                operatingHours:
                  type: object
                  properties:
                    checkIn:
                      type: string
                    checkOut:
                      type: string
                    isOpen24h:
                      type: boolean
                policies:
                  type: object
                  properties:
                    cancellationHours:
                      type: number
                    requireVaccination:
                      type: boolean
                    maxPetWeight:
                      type: number
                    additionalNotes:
                      type: string
      responses:
        200:
          description: Cập nhật khách sạn thành công
  /hotel-bookings:
    get:
      summary: Lịch sử đặt phòng
      tags: [Hotels & Bookings]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - name: page
          in: query
          description: Số trang
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số bộ ghi trên trang
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 2
                  total:
                    type: integer
                    example: 5
                  page:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      type: object
                      example:
                        _id: "507f1f77bcf86cd799439020"
                        user:
                          _id: "507f1f77bcf86cd799439001"
                          fullName: "Trần Thị B"
                          phone: "0987654321"
                        hotel:
                          _id: "507f1f77bcf86cd799439011"
                          name: "Happy Pet Hotel"
                          city: "TP. Hồ Chí Minh"
                          rating:
                            average: 4.8
                        checkIn: "2024-06-01"
                        checkOut: "2024-06-05"
                        numberOfNights: 4
                        totalPrice: 2000000
                        status: "confirmed"
                        notes: "Chó hay sủa, cần chỗ yên tĩnh"
                        createdAt: "2024-05-17T10:00:00Z"
                        updatedAt: "2024-05-17T10:30:00Z"
    post:
      summary: Đặt phòng khách sạn
      tags: [Hotels & Bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotel
                - checkIn
                - checkOut
              properties:
                hotel:
                  type: string
                  description: ID của khách sạn (bắt buộc)
                  example: "507f1f77bcf86cd799439011"
                fullName:
                  type: string
                  description: Họ tên người đặt phòng (nếu không truyền sẽ lấy từ tài khoản)
                  example: "Nguyễn Văn A"
                phone:
                  type: string
                  description: Số điện thoại người đặt (nếu không truyền sẽ lấy từ tài khoản)
                  example: "0123456789"
                email:
                  type: string
                  description: Email người đặt (nếu không truyền sẽ lấy từ tài khoản)
                  example: "nguyenvana@gmail.com"
                checkIn:
                  type: string
                  format: date
                  description: Ngày check-in (YYYY-MM-DD, bắt buộc)
                  example: "2024-06-01"
                checkOut:
                  type: string
                  format: date
                  description: Ngày check-out (YYYY-MM-DD, bắt buộc)
                  example: "2024-06-05"
                specialRequests:
                  type: string
                  description: Ghi chú / yêu cầu đặc biệt
                  example: "Chó hay sủa, cần chỗ yên tĩnh"
            example:
              hotel: "507f1f77bcf86cd799439011"
              fullName: "Nguyễn Văn A"
              phone: "0123456789"
              email: "nguyenvana@gmail.com"
              checkIn: "2024-06-01"
              checkOut: "2024-06-05"
              specialRequests: "Chó hay sủa, cần chỗ yên tĩnh"
      responses:
        201:
          description: Đặt phòng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Đặt phòng thành công!"
                  data:
                    type: object
                    example:
                      _id: "507f1f77bcf86cd799439020"
                      user: "507f1f77bcf86cd799439001"
                      hotel: "507f1f77bcf86cd799439011"
                      fullName: "Nguyễn Văn A"
                      phone: "0123456789"
                      email: "nguyenvana@gmail.com"
                      checkIn: "2024-06-01"
                      checkOut: "2024-06-05"
                      status: "pending"
                      specialRequests: "Chó hay sủa, cần chỗ yên tĩnh"
                      createdAt: "2024-05-17T10:00:00Z"
  /hotel-bookings/{id}/status:
    put:
      summary: Cập nhật trạng thái booking
      tags: [Hotels & Bookings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID của booking cần cập nhật
            example: "507f1f77bcf86cd799439020"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
                  description: Trạng thái mới của booking (bắt buộc)
                  example: "confirmed"
                cancellationReason:
                  type: string
                  description: Lý do hủy (bắt buộc nếu status là 'cancelled')
                  example: "Thay đổi kế hoạch"
            example:
              status: "confirmed"
      responses:
        200:
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật trạng thái booking thành công."
                  data:
                    type: object
                    example:
                      _id: "507f1f77bcf86cd799439020"
                      user: "507f1f77bcf86cd799439001"
                      hotel: "507f1f77bcf86cd799439011"
                      checkIn: "2024-06-01"
                      checkOut: "2024-06-05"
                      numberOfNights: 4
                      totalPrice: 2000000
                      status: "confirmed"
                      notes: "Chó hay sủa, cần chỗ yên tĩnh"
                      updatedAt: "2024-05-17T10:30:00Z"
        400:
          description: Yêu cầu không hợp lệ
        403:
          description: Không có quyền
        404:
          description: Không tìm thấy booking
          
  /chat:
    post:
      summary: Gửi tin nhắn/Chat với AI tư vấn (Premium)
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sessionId
          required: false
          schema:
            type: string
          description: ID phiên chat (để tiếp tục cuộc trò chuyện cũ, nếu không có thì tạo session mới)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Nội dung tin nhắn (bắt buộc)
                petId:
                  type: string
                  description: ID thú cưng (tùy chọn, để AI có context về thú cưng)
      responses:
        200:
          description: Phản hồi từ AI
  /chat/history:
    get:
      summary: Lấy lịch sử chat
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Danh sách lịch sử chat
  /chat/{sessionId}:
    get:
      summary: Lấy chi tiết phiên chat
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: ID phiên chat
      responses:
        200:
          description: Chi tiết phiên chat
  /chat/{sessionId}/end:
    put:
      summary: Kết thúc phiên chat
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: ID phiên chat
      responses:
        200:
          description: Phiên chat đã kết thúc
          
  /subscription:
    get:
      summary: Lấy thông tin gói dịch vụ hiện tại
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thông tin gói dịch vụ
          
  /subscription/plans:
    get:
      summary: Xem các gói cước Subscription (Free / Plus / Vip)
      tags: [AI Chatbot & Activity]
      responses:
        200:
          description: Thông tin các gói
  /subscription/upgrade/plus:
    post:
      summary: Nâng cấp lên gói Plus
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  description: ID user cần nâng gói. Nếu bỏ trống thì áp dụng cho chính tài khoản đang đăng nhập.
      responses:
        200:
          description: Nâng cấp thành công
  /subscription/upgrade/vip:
    post:
      summary: Nâng cấp lên gói Vip
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  description: ID user cần nâng gói. Nếu bỏ trống thì áp dụng cho chính tài khoản đang đăng nhập.
      responses:
        200:
          description: Nâng cấp thành công

  /subscription/upgrade:
    post:
      summary: Nâng cấp lên gói Plus (backward compatible)
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        200:
          description: Nâng cấp thành công

  /subscription/cancel:
    post:
      summary: Hủy gói Premium
      tags: [AI Chatbot & Activity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Lý do hủy
      responses:
        200:
          description: Hủy gói thành công
