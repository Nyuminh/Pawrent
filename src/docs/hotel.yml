tags:
  - name: Hotels
    description: Quản lý khách sạn thú cưng

paths:
  /hotels:
    get:
      summary: Danh sách khách sạn thú cưng
      tags: [Hotels]
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Lọc theo thành phố
        - in: query
          name: petType
          schema:
            type: string
            enum: [dog, cat, bird, hamster, rabbit, other]
          description: Lọc theo loại thú cưng
        - in: query
          name: minRating
          schema:
            type: number
          description: Lọc theo đánh giá tối thiểu
        - in: query
          name: minPrice
          schema:
            type: number
          description: Giá tối thiểu
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Giá tối đa
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Trang
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Số bản ghi trên trang
      responses:
        200:
          description: Thành công
    post:
      summary: Đăng ký khách sạn thú cưng mới
      tags: [Hotels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, address, phone]
              properties:
                name:
                  type: string
                  example: Happy Pet Hotel
                description:
                  type: string
                  example: Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp
                address:
                  type: object
                  required: [street, city]
                  properties:
                    street:
                      type: string
                      example: "123 Đường Nguyễn Hữu Cảnh"
                    city:
                      type: string
                      example: "TP. Hồ Chí Minh"
                    district:
                      type: string
                    ward:
                      type: string
                phone:
                  type: string
                  example: "0123456789"
                email:
                  type: string
                acceptedPets:
                  type: array
                  items:
                    type: string
                    enum: [dog, cat, bird, hamster, rabbit, other]
                  default: [dog, cat]
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      price:
                        type: number
                      currency:
                        type: string
                        default: VND
      responses:
        201:
          description: Đăng ký thành công

  /hotels/{id}:
    get:
      summary: Chi tiết khách sạn
      tags: [Hotels]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
    put:
      summary: Cập nhật thông tin khách sạn + Upload nhiều ảnh
      description: |
        Cập nhật thông tin khách sạn và upload tối đa 10 ảnh.
        Ảnh được tải lên sẽ thay thế ảnh cũ.
      tags: [Hotels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tên khách sạn
                description:
                  type: string
                  description: Mô tả khách sạn
                address:
                  type: string
                  description: JSON string của address object
                  example: '{"street":"123 Đường Nguyễn Hữu Cảnh","city":"TP. Hồ Chí Minh","district":"Q1"}'
                phone:
                  type: string
                email:
                  type: string
                acceptedPets:
                  type: array
                  items:
                    type: string
                    enum: [dog, cat, bird, hamster, rabbit, other]
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Ảnh khách sạn (tối đa 10 ảnh, định dạng JPEG/PNG/GIF/WebP, mỗi file tối đa 5MB)
                services:
                  type: string
                  description: JSON string của mảng services
                  example: '[{"name":"Tắm gội","description":"Tắm gội chuyên nghiệp","price":150000,"currency":"VND"}]'
                operatingHours:
                  type: string
                  description: JSON string của operatingHours object
                  example: '{"checkIn":"14:00","checkOut":"12:00","isOpen24h":false}'
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật khách sạn thành công."
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: "https://res.cloudinary.com/pawrent/image/upload/..."
                            caption:
                              type: string
                      owner:
                        type: string
