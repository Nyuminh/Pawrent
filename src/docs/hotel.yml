tags:
  - name: Hotels
    description: Quản lý khách sạn thú cưng

paths:
  /hotels:
    get:
      summary: Danh sách khách sạn thú cưng
      tags: [Hotels]
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Lọc theo thành phố
        - in: query
          name: petType
          schema:
            type: string
            enum: [dog, cat, bird, hamster, rabbit, other]
          description: Lọc theo loại thú cưng
        - in: query
          name: minRating
          schema:
            type: number
          description: Lọc theo đánh giá tối thiểu
        - in: query
          name: minPrice
          schema:
            type: number
          description: Giá tối thiểu
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Giá tối đa
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Trang
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Số bản ghi trên trang
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Trạng thái yêu cầu
                    example: true
                  count:
                    type: integer
                    description: Số lượng khách sạn trong trang hiện tại
                    example: 2
                  total:
                    type: integer
                    description: Tổng số khách sạn trong database
                    example: 12
                  page:
                    type: integer
                    description: Trang hiện tại
                    example: 1
                  totalPages:
                    type: integer
                    description: Tổng số trang
                    example: 6
                  data:
                    type: array
                    description: Danh sách khách sạn
                    items:
                      type: object
                      properties:
                        hotelId:
                          type: string
                          description: ID khách sạn (MongoDB ObjectId)
                          example: "507f1f77bcf86cd799439011"
                        name:
                          type: string
                          description: Tên khách sạn
                          example: "Happy Pet Hotel"
                        description:
                          type: string
                          description: Mô tả khách sạn
                          example: "Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp"
                        owner:
                          type: object
                          description: Thông tin chủ khách sạn
                          properties:
                            ownerId:
                              type: string
                              description: ID chủ sở hữu (User ID)
                              example: "507f1f77bcf86cd799439012"
                            fullName:
                              type: string
                              example: "Nguyễn Văn A"
                            avatar:
                              type: string
                              description: URL avatar của chủ sạn
                              example: "https://res.cloudinary.com/pawrent/image/upload/v123/avatar.jpg"
                        address:
                          type: object
                          description: Địa chỉ khách sạn
                          properties:
                            street:
                              type: string
                              example: "123 Đường Nguyễn Hữu Cảnh"
                            city:
                              type: string
                              example: "TP. Hồ Chí Minh"
                            district:
                              type: string
                              example: "Quận 1"
                            ward:
                              type: string
                              example: "Phường Bến Nghé"
                            coordinates:
                              type: object
                              description: Tọa độ địa lý (GPS)
                              properties:
                                lat:
                                  type: number
                                  description: Vĩ độ
                                  example: 10.7769
                                lng:
                                  type: number
                                  description: Kinh độ
                                  example: 106.6966
                        phone:
                          type: string
                          description: Số điện thoại khách sạn
                          example: "0123456789"
                        email:
                          type: string
                          description: Email khách sạn
                          example: "contact@happypethotel.vn"
                        services:
                          type: array
                          description: Danh sách dịch vụ cung cấp
                          items:
                            type: object
                            properties:
                              serviceId:
                                type: string
                                description: ID dịch vụ
                                example: "507f1f77bcf86cd799439013"
                              name:
                                type: string
                                example: "Phòng VIP"
                              description:
                                type: string
                                example: "Phòng sang trọng với điều hòa"
                              price:
                                type: number
                                example: 500000
                              currency:
                                type: string
                                example: "VND"
                        rooms:
                          type: array
                          description: Danh sách loại phòng
                          items:
                            type: object
                            properties:
                              roomId:
                                type: string
                                description: ID loại phòng
                                example: "507f1f77bcf86cd799439014"
                              type:
                                type: string
                                enum: [standard, deluxe, vip, suite]
                                example: "vip"
                              name:
                                type: string
                                example: "Phòng VIP"
                              description:
                                type: string
                                example: "Phòng cao cấp"
                              pricePerNight:
                                type: number
                                description: Giá mỗi đêm (VND)
                                example: 500000
                              capacity:
                                type: integer
                                description: Sức chứa (số thú cưng)
                                example: 2
                              totalRooms:
                                type: integer
                                description: Tổng số phòng loại này
                                example: 10
                              availableRooms:
                                type: integer
                                description: Số phòng còn trống
                                example: 8
                              amenities:
                                type: array
                                description: Tiện nghi phòng
                                items:
                                  type: string
                                example: [điều hòa, giường lớn, TV]
                        images:
                          type: array
                          description: Danh sách hình ảnh khách sạn
                          items:
                            type: object
                            properties:
                              imageId:
                                type: string
                                description: ID hình ảnh
                                example: "507f1f77bcf86cd799439015"
                              url:
                                type: string
                                description: URL hình ảnh
                                example: "https://res.cloudinary.com/pawrent/image/upload/v123/hotel1.jpg"
                              caption:
                                type: string
                                description: Chú thích hình ảnh
                                example: "Phòng ở"
                        rating:
                          type: object
                          description: Xếp hạng khách sạn
                          properties:
                            average:
                              type: number
                              description: Điểm xếp hạng trung bình (0-5)
                              example: 4.8
                            count:
                              type: integer
                              description: Số lượng đánh giá
                              example: 25
                        operatingHours:
                          type: object
                          description: Giờ hoạt động
                          properties:
                            checkIn:
                              type: string
                              description: Giờ check-in (HH:mm)
                              example: "14:00"
                            checkOut:
                              type: string
                              description: Giờ check-out (HH:mm)
                              example: "12:00"
                            isOpen24h:
                              type: boolean
                              description: Hoạt động 24/7?
                              example: false
                        policies:
                          type: object
                          description: Chính sách khách sạn
                          properties:
                            cancellationHours:
                              type: integer
                              description: Hủy trước bao nhiêu giờ
                              example: 24
                            requireVaccination:
                              type: boolean
                              description: Yêu cầu tiêm chủng?
                              example: true
                            maxPetWeight:
                              type: number
                              description: Cân nặng tối đa thú cưng (kg)
                              example: 20
                            additionalNotes:
                              type: string
                              description: Ghi chú thêm
                              example: "Không nhận chó hung hăng"
                        commissionRate:
                          type: number
                          description: Tỉ lệ hoa hồng cho hệ thống
                          example: 0.15
                        slug:
                          type: string
                          description: Slug dùng cho URL
                          example: "happy-pet-hotel-mp3qzgzp"
                        isVerified:
                          type: boolean
                          description: Khách sạn đã được xác minh?
                          example: true
                        isActive:
                          type: boolean
                          description: Khách sạn còn hoạt động?
                          example: true
                        createdAt:
                          type: string
                          format: date-time
                          description: Ngày tạo
                          example: "2024-01-10T10:30:00Z"
                        updatedAt:
                          type: string
                          format: date-time
                          description: Ngày cập nhật cuối
                          example: "2024-05-17T14:30:00Z"
    post:
      summary: Đăng ký khách sạn thú cưng mới
      tags: [Hotels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, address, phone]
              properties:
                name:
                  type: string
                  description: Tên khách sạn (bắt buộc)
                  example: Happy Pet Hotel
                description:
                  type: string
                  description: Mô tả khách sạn (bắt buộc)
                  example: Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp
                address:
                  type: string
                  description: |
                    Địa chỉ khách sạn (JSON string, bắt buộc).
                    Ví dụ: {"street":"123 Đường ABC","city":"TP. Hồ Chí Minh","district":"Quận 1","ward":"Phường Bến Nghé"}
                  example: '{"street":"123 Đường Nguyễn Hữu Cảnh","city":"TP. Hồ Chí Minh","district":"Quận 1","ward":"Phường Bến Nghé"}'
                phone:
                  type: string
                  description: Số điện thoại liên hệ (bắt buộc)
                  example: "0123456789"
                email:
                  type: string
                  description: Email liên hệ
                  example: "contact@happypethotel.vn"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Ảnh khách sạn (tối đa 10 ảnh, định dạng JPEG/PNG/GIF/WebP, mỗi file tối đa 5MB)
                services:
                  type: string
                  description: |
                    Danh sách dịch vụ (JSON string).
                    Ví dụ: [{"name":"Tắm gội","description":"Tắm gội chuyên nghiệp","price":150000,"currency":"VND"}]
                  example: '[{"name":"Tắm gội","description":"Dịch vụ tắm gội","price":150000,"currency":"VND"}]'
                rooms:
                  type: string
                  description: |
                    Danh sách loại phòng (JSON string).
                    Ví dụ: [{"type":"standard","name":"Phòng Standard","pricePerNight":200000,"capacity":2,"totalRooms":10}]
                  example: '[{"type":"standard","name":"Phòng Standard","pricePerNight":200000,"capacity":2,"totalRooms":10,"availableRooms":10}]'
                operatingHours:
                  type: string
                  description: |
                    Giờ hoạt động (JSON string).
                    Ví dụ: {"checkIn":"14:00","checkOut":"12:00","isOpen24h":false}
                  example: '{"checkIn":"14:00","checkOut":"12:00","isOpen24h":false}'
                policies:
                  type: string
                  description: |
                    Chính sách khách sạn (JSON string).
                    Ví dụ: {"cancellationHours":24,"requireVaccination":true}
                  example: '{"cancellationHours":24,"requireVaccination":true}'

      responses:
        201:
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Đăng ký khách sạn thành công!"
                  data:
                    type: object
                    example:
                      _id: "507f1f77bcf86cd799439011"
                      name: "Happy Pet Hotel"
                      description: "Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp"
                      owner: "507f1f77bcf86cd799439012"
                      address:
                        street: "123 Đường Nguyễn Hữu Cảnh"
                        city: "TP. Hồ Chí Minh"
                        district: "Quận 1"
                        ward: "Phường Bến Nghé"
                      phone: "0123456789"
                      email: "contact@happypethotel.vn"
                      services:
                        - _id: "507f1f77bcf86cd799439013"
                          name: "Phòng VIP"
                          description: "Phòng sang trọng với điều hòa"
                          price: 500000
                          currency: "VND"
                      isActive: true
                      isVerified: false
                      createdAt: "2024-05-17T10:30:00Z"

  /hotels/my:
    get:
      summary: Lấy danh sách khách sạn của tôi
      description: |
        Trả về tất cả khách sạn thuộc sở hữu của người dùng đang đăng nhập (hotel owner).
        Bao gồm cả khách sạn đang hoạt động và không hoạt động.
      tags: [Hotels]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    description: Số lượng khách sạn
                    example: 1
                  data:
                    type: array
                    description: Danh sách khách sạn của chủ sở hữu
                    items:
                      type: object
                      properties:
                        hotelId:
                          type: string
                          example: "507f1f77bcf86cd799439011"
                        name:
                          type: string
                          example: "Happy Pet Hotel"
                        description:
                          type: string
                          example: "Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp"
                        owner:
                          type: object
                          properties:
                            ownerId:
                              type: string
                              example: "507f1f77bcf86cd799439012"
                            fullName:
                              type: string
                              example: "Nguyễn Văn A"
                            avatar:
                              type: string
                              example: "https://res.cloudinary.com/pawrent/image/upload/avatar.jpg"
                            phone:
                              type: string
                              example: "0123456789"
                            email:
                              type: string
                              example: "owner@example.com"
                        address:
                          type: object
                          properties:
                            street:
                              type: string
                            city:
                              type: string
                            district:
                              type: string
                            ward:
                              type: string
                        phone:
                          type: string
                        email:
                          type: string
                        rooms:
                          type: array
                          items:
                            type: object
                        rating:
                          type: object
                          properties:
                            average:
                              type: number
                            count:
                              type: integer
                        isVerified:
                          type: boolean
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
        401:
          description: Chưa đăng nhập

  /hotels/{id}:
    get:
      summary: Chi tiết khách sạn
      tags: [Hotels]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      hotelId:
                        type: string
                        description: ID khách sạn (MongoDB ObjectId)
                        example: "507f1f77bcf86cd799439011"
                      name:
                        type: string
                        description: Tên khách sạn
                        example: "Happy Pet Hotel"
                      description:
                        type: string
                        description: Mô tả chi tiết khách sạn
                        example: "Khách sạn yên tĩnh với dịch vụ chăm sóc thú cưng chuyên nghiệp"
                      owner:
                        type: object
                        description: Thông tin chủ khách sạn
                        properties:
                          ownerId:
                            type: string
                            description: ID chủ sở hữu khách sạn (User ID)
                            example: "507f1f77bcf86cd799439012"
                          fullName:
                            type: string
                            example: "Nguyễn Văn A"
                          email:
                            type: string
                            example: "owner@happypethotel.vn"
                          phone:
                            type: string
                            example: "0123456789"
                      address:
                        type: object
                        description: Địa chỉ khách sạn
                        properties:
                          street:
                            type: string
                            example: "123 Đường Nguyễn Hữu Cảnh"
                          city:
                            type: string
                            example: "TP. Hồ Chí Minh"
                          district:
                            type: string
                            example: "Quận 1"
                          ward:
                            type: string
                            example: "Phường Bến Nghé"
                      phone:
                        type: string
                        description: Số điện thoại liên hệ khách sạn
                        example: "0123456789"
                      email:
                        type: string
                        description: Email liên hệ khách sạn
                        example: "contact@happypethotel.vn"
                      priceRange:
                        type: object
                        description: Khoảng giá phòng
                        properties:
                          min:
                            type: number
                            example: 200000
                          max:
                            type: number
                            example: 500000
                          currency:
                            type: string
                            example: "VND"
                      rating:
                        type: object
                        description: Xếp hạng khách sạn
                        properties:
                          average:
                            type: number
                            description: Điểm xếp hạng trung bình (0-5)
                            example: 4.8
                          count:
                            type: integer
                            description: Số lượng đánh giá
                            example: 25
                      images:
                        type: array
                        description: Danh sách hình ảnh khách sạn
                        items:
                          type: object
                          properties:
                            imageUrl:
                              type: string
                              description: URL của hình ảnh
                              example: "https://res.cloudinary.com/pawrent/image/upload/v123/hotel1.jpg"
                            caption:
                              type: string
                              description: Chú thích hình ảnh
                              example: "Phòng ở"
                      services:
                        type: array
                        description: Danh sách dịch vụ cung cấp
                        items:
                          type: object
                          properties:
                            serviceId:
                              type: string
                              description: ID dịch vụ
                              example: "507f1f77bcf86cd799439013"
                            name:
                              type: string
                              example: "Phòng VIP"
                            description:
                              type: string
                              example: "Phòng sang trọng với điều hòa"
                            price:
                              type: number
                              example: 500000
                            currency:
                              type: string
                              example: "VND"
                      operatingHours:
                        type: object
                        description: Giờ hoạt động khách sạn
                        properties:
                          checkIn:
                            type: string
                            description: Giờ check-in (HH:mm)
                            example: "14:00"
                          checkOut:
                            type: string
                            description: Giờ check-out (HH:mm)
                            example: "12:00"
                          isOpen24h:
                            type: boolean
                            description: Có hoạt động 24/7 không?
                            example: false
                      capacity:
                        type: object
                        description: Sức chứa của khách sạn
                        properties:
                          total:
                            type: integer
                            description: Tổng số phòng
                            example: 50
                          available:
                            type: integer
                            description: Số phòng còn trống
                            example: 10
                      reviews:
                        type: array
                        description: Danh sách đánh giá từ khách hàng
                        items:
                          type: object
                          properties:
                            reviewId:
                              type: string
                              description: ID đánh giá
                              example: "507f1f77bcf86cd799439016"
                            user:
                              type: object
                              description: Thông tin người đánh giá
                              properties:
                                userId:
                                  type: string
                                  description: ID người dùng
                                  example: "507f1f77bcf86cd799439017"
                                fullName:
                                  type: string
                                  example: "Trần Thị B"
                                avatar:
                                  type: string
                                  example: "https://res.cloudinary.com/pawrent/image/upload/v123/user.jpg"
                            rating:
                              type: integer
                              description: Điểm đánh giá (1-5)
                              example: 5
                            comment:
                              type: string
                              example: "Dịch vụ rất tốt, chú chó yêu lắm"
                            createdAt:
                              type: string
                              format: date-time
                              description: Thời gian đánh giá
                              example: "2024-05-15T08:00:00Z"
                      isActive:
                        type: boolean
                        description: Khách sạn có hoạt động không?
                        example: true
                      isVerified:
                        type: boolean
                        description: Khách sạn đã được xác minh không?
                        example: true
                      createdAt:
                        type: string
                        format: date-time
                        description: Ngày tạo khách sạn
                        example: "2024-01-10T10:30:00Z"
        404:
          description: Không tìm thấy khách sạn
    put:
      summary: Cập nhật thông tin khách sạn + Upload nhiều ảnh
      description: |
        Cập nhật thông tin khách sạn và upload tối đa 10 ảnh.
        Ảnh được tải lên sẽ thay thế ảnh cũ.
      tags: [Hotels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tên khách sạn
                  example: "Happy Pet Hotel Premium"
                description:
                  type: string
                  description: Mô tả khách sạn
                  example: "Khách sạn cao cấp với dịch vụ 5 sao cho thú cưng"
                address:
                  type: string
                  description: |
                    Địa chỉ khách sạn (JSON string).
                    Ví dụ: {"street":"123 Đường ABC","city":"TP. Hồ Chí Minh","district":"Quận 1","ward":"Phường Bến Nghé"}
                  example: '{"street":"123 Đường Nguyễn Hữu Cảnh","city":"TP. Hồ Chí Minh","district":"Q1","ward":"Phường Bến Nghé"}'
                phone:
                  type: string
                  example: "0123456789"
                email:
                  type: string
                  example: "contact@happypethotel.vn"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Ảnh khách sạn (không bắt buộc, tối đa 10 ảnh, JPEG/PNG/GIF/WebP, mỗi file tối đa 5MB)
                services:
                  type: string
                  description: |
                    Danh sách dịch vụ (JSON string).
                    Ví dụ: [{"name":"Tắm gội","description":"Tắm gội chuyên nghiệp","price":150000,"currency":"VND"}]
                  example: '[{"name":"Phòng VIP","description":"Phòng sang trọng với điều hòa","price":500000,"currency":"VND"},{"name":"Tắm gội","description":"Tắm gội chuyên nghiệp","price":150000,"currency":"VND"}]'
                rooms:
                  type: string
                  description: |
                    Danh sách loại phòng (JSON string).
                    Ví dụ: [{"type":"standard","name":"Phòng Standard","pricePerNight":200000,"capacity":2,"totalRooms":10,"availableRooms":10}]
                  example: '[{"type":"standard","name":"Phòng Standard","pricePerNight":200000,"capacity":2,"totalRooms":10,"availableRooms":10},{"type":"vip","name":"Phòng VIP","pricePerNight":500000,"capacity":2,"totalRooms":5,"availableRooms":5}]'
                operatingHours:
                  type: string
                  description: |
                    Giờ hoạt động (JSON string).
                    Ví dụ: {"checkIn":"14:00","checkOut":"12:00","isOpen24h":false}
                  example: '{"checkIn":"14:00","checkOut":"12:00","isOpen24h":false}'
                policies:
                  type: string
                  description: |
                    Chính sách khách sạn (JSON string).
                    Ví dụ: {"cancellationHours":24,"requireVaccination":true}
                  example: '{"cancellationHours":24,"requireVaccination":true}'
                status:
                  type: string
                  enum: [active, inactive]
                  description: Trạng thái khách sạn
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Cập nhật khách sạn thành công."
                  data:
                    type: object
                    example:
                      _id: "507f1f77bcf86cd799439011"
                      name: "Happy Pet Hotel Premium"
                      description: "Khách sạn cao cấp với dịch vụ 5 sao cho thú cưng"
                      address:
                        street: "123 Đường Nguyễn Hữu Cảnh"
                        city: "TP. Hồ Chí Minh"
                        district: "Quận 1"
                        ward: "Phường Bến Nghé"
                      phone: "0123456789"
                      email: "contact@happypethotel.vn"
                      images:
                        - url: "https://res.cloudinary.com/pawrent/image/upload/v124/hotel1.jpg"
                          caption: "Phòng ở"
                        - url: "https://res.cloudinary.com/pawrent/image/upload/v124/hotel2.jpg"
                          caption: "Khu chơi"
                      services:
                        - _id: "507f1f77bcf86cd799439013"
                          name: "Phòng VIP"
                          description: "Phòng sang trọng với điều hòa"
                          price: 500000
                          currency: "VND"
                        - _id: "507f1f77bcf86cd799439014"
                          name: "Tắm gội"
                          description: "Tắm gội chuyên nghiệp"
                          price: 150000
                          currency: "VND"
                      operatingHours:
                        checkIn: "14:00"
                        checkOut: "12:00"
                        isOpen24h: false
                      capacity:
                        total: 50
                        available: 10
                      updatedAt: "2024-05-17T14:30:00Z"
        403:
          description: Không có quyền cập nhật khách sạn này
        404:
          description: Không tìm thấy khách sạn
    delete:
      summary: Xóa khách sạn
      description: |
        Xóa khách sạn. Chỉ chủ khách sạn hoặc admin có quyền xóa.
        Các booking liên quan sẽ được xóa theo.
      tags: [Hotels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        200:
          description: Xóa thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Xóa khách sạn thành công."
                  data:
                    type: object
                    example: {}
        403:
          description: Không có quyền xóa khách sạn này
        404:
          description: Không tìm thấy khách sạn

  /hotels/{hotelId}/rooms/occupancy:
    get:
      summary: Dashboard xem tình trạng phòng - Chủ khách sạn
      description: Xem chi tiết tình trạng phòng, ai đang ở phòng nào, giờ check-in/out tiếp theo. Chỉ chủ khách sạn có quyền truy cập.
      tags: [Hotels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
          description: ID khách sạn
          example: "507f1f77bcf86cd799439011"
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Ngày bắt đầu lọc (YYYY-MM-DD)
          example: "2026-05-17"
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Ngày kết thúc lọc (YYYY-MM-DD)
          example: "2026-06-17"
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  hotel:
                    type: object
                    properties:
                      hotelId:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      name:
                        type: string
                        example: "Happy Pet Hotel"
                  totalOccupancy:
                    type: object
                    description: Tổng quan chiếm dụng phòng
                    properties:
                      totalRooms:
                        type: integer
                        example: 20
                      occupiedRooms:
                        type: integer
                        example: 15
                      availableRooms:
                        type: integer
                        example: 5
                      occupancyRate:
                        type: integer
                        description: Tỉ lệ % phòng đã chiếm dụng
                        example: 75
                  dateRange:
                    type: object
                    properties:
                      from:
                        type: string
                        example: "2026-05-17"
                      to:
                        type: string
                        example: "2026-06-17"
                  roomTypes:
                    type: array
                    description: Chi tiết phòng theo từng loại
                    items:
                      type: object
                      properties:
                        roomId:
                          type: string
                          example: "507f1f77bcf86cd799439012"
                        type:
                          type: string
                          example: "standard"
                        name:
                          type: string
                          example: "Phòng Standard"
                        description:
                          type: string
                          example: "Phòng tiêu chuẩn cho thú cưng"
                        pricePerNight:
                          type: number
                          example: 300000
                        capacity:
                          type: integer
                          example: 2
                        totalRooms:
                          type: integer
                          example: 10
                        amenities:
                          type: array
                          items:
                            type: string
                          example: ["AC", "WiFi", "Pet bed"]
                        summary:
                          type: object
                          description: Tóm tắt tình trạng loại phòng này
                          properties:
                            totalRooms:
                              type: integer
                              example: 10
                            occupiedRooms:
                              type: integer
                              example: 7
                            availableRooms:
                              type: integer
                              example: 3
                            occupancyRate:
                              type: integer
                              example: 70
                        bookings:
                          type: array
                          description: Danh sách khách hiện tại đang ở
                          items:
                            type: object
                            properties:
                              bookingId:
                                type: string
                                example: "507f1f77bcf86cd799439020"
                              roomNumber:
                                type: string
                                description: 'Số phòng (VD: 101, 102)'
                                example: "101"
                              guestName:
                                type: string
                                example: "Nguyễn Văn A"
                              guestPhone:
                                type: string
                                example: "0912345678"
                              guestEmail:
                                type: string
                                example: "guest@example.com"
                              checkIn:
                                type: string
                                format: date-time
                                example: "2026-05-17T15:00:00Z"
                              checkOut:
                                type: string
                                format: date-time
                                example: "2026-05-20T12:00:00Z"
                              status:
                                type: string
                                enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
                                example: "checked_in"
                              specialRequests:
                                type: string
                                example: "Cần yên tĩnh, thú cưng sợ tiếng ồn"
                              duration:
                                type: integer
                                description: Số đêm ở
                                example: 3
        401:
          description: Chưa đăng nhập
        403:
          description: Bạn không phải chủ khách sạn này
        404:
          description: Không tìm thấy khách sạn
