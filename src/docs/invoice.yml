tags:
  - name: Invoices
    description: Quản lý hóa đơn (Invoices)

paths:
  /invoices:
    post:
      summary: Tạo hóa đơn mới
      description: Tạo một hóa đơn cho booking/appointment/subscription trước khi thực hiện thanh toán
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                user:
                  type: string
                  description: ID người dùng (nếu không truyền sẽ dùng user đang đăng nhập)
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Loại item (appointment|booking|subscription|product)
                      refId:
                        type: string
                        description: ID tham chiếu (ví dụ appointmentId)
                      description:
                        type: string
                      price:
                        type: number
                currency:
                  type: string
                  description: Mã tiền tệ (mặc định VND)
      responses:
        201:
          description: Hóa đơn được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        400:
          description: Dữ liệu không hợp lệ
        401:
          description: Không được xác thực

    get:
      summary: Lấy danh sách hóa đơn của người dùng
      description: Lấy danh sách hóa đơn; admin có thể xem tất cả
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực

  /invoices/subscription:
    post:
      summary: Tạo hóa đơn cho gói subscription
      description: "Tạo hóa đơn cho subscription plan (ví dụ: PLUS, VUP)"
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscriptionPlan
              properties:
                subscriptionPlan:
                  type: string
                  description: Mã gói subscription (PLUS, VUP...)
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn subscription được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/booking:
    post:
      summary: Tạo hóa đơn cho appointment (legacy booking endpoint repurposed)
      description: Hotels do not require prepayment; this endpoint now creates an invoice for an appointment. Truyền `appointmentId`.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appointmentId
              properties:
                appointmentId:
                  type: string
                  description: ID của appointment
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn booking được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/cart:
    post:
      summary: Tạo hóa đơn từ giỏ hàng người dùng
      description: Tạo hóa đơn dựa trên giỏ hàng hiện tại của người dùng (không tự động xóa giỏ hàng)
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn cart được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/service:
    post:
      summary: Tạo hóa đơn cho một Service
      description: Tạo hóa đơn cho dịch vụ đã định nghĩa trong hệ thống (ví dụ cắt tỉa, khám bệnh). Truyền `serviceId` và `quantity` nếu cần.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceId
              properties:
                serviceId:
                  type: string
                quantity:
                  type: integer
                  default: 1
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn service được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/products:
    post:
      summary: Tạo hóa đơn từ các sản phẩm được chọn
      description: Truyền mảng `products` gồm `productId` và `quantity`, backend sẽ tự lấy giá từng sản phẩm và tính tổng tiền.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products
              properties:
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - productId
                    properties:
                      productId:
                        type: string
                        description: ID sản phẩm
                      quantity:
                        type: integer
                        default: 1
                currency:
                  type: string
                address:
                  type: string
                  description: Địa chỉ giao hàng/thanh toán
                dueDate:
                  type: string
                  format: date
      responses:
        201:
          description: Hóa đơn products được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{id}:
    get:
      summary: Lấy thông tin chi tiết hóa đơn
      description: Lấy chi tiết một hóa đơn theo ID
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn
    delete:
      summary: Xóa hóa đơn theo ID
      description: Xóa một hóa đơn theo ID. Không cần phân quyền, chỉ cần xác thực.
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 6630f1b6f6d4e8a1c2b3d4e5
          description: ID hóa đơn cần xóa
      responses:
        200:
          description: Xóa hóa đơn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        401:
          description: Không được xác thực
        404:
          description: Không tìm thấy hóa đơn

  /invoices/{id}/status:
    get:
      summary: Lấy trạng thái hóa đơn
      description: Trả về trạng thái hiện tại của hóa đơn và thông tin payment liên quan (nếu có). Dùng để polling từ frontend.
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      payment:
                        type: object
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn

components:
  schemas:
    InvoiceItem:
      type: object
      properties:
        type:
          type: string
          description: Loại item (appointment|booking|subscription|product)
        refId:
          type: string
          description: ID tham chiếu
        name:
          type: string
          description: Tên item (cho appointment sẽ hiển thị tên dịch vụ)
        price:
          type: number
        quantity:
          type: integer

    Invoice:
      type: object
      properties:
        _id:
          type: string
        invoiceNumber:
          type: string
        user:
          type: object
          properties:
            _id:
              type: string
            fullName:
              type: string
            email:
              type: string
            phone:
              type: string
            address:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        subtotal:
          type: number
        tax:
          type: number
        discount:
          type: number
        total:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, cancelled]
        address:
          type: string
          description: Địa chỉ giao hàng/thanh toán
        appointment:
          type: object
          description: Chi tiết appointment nếu hóa đơn là cho appointment
        payment:
          type: string
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
