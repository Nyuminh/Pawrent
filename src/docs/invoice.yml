tags:
  - name: Invoices
    description: Quản lý hóa đơn (Invoices)

paths:
  /invoices:
    post:
      summary: Tạo hóa đơn mới
      description: Tạo một hóa đơn cho booking/appointment/subscription trước khi thực hiện thanh toán
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                user:
                  type: string
                  description: ID người dùng (nếu không truyền sẽ dùng user đang đăng nhập)
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Loại item (appointment|booking|subscription|product)
                      refId:
                        type: string
                        description: ID tham chiếu (ví dụ appointmentId)
                      description:
                        type: string
                      price:
                        type: number
                currency:
                  type: string
                  description: Mã tiền tệ (mặc định VND)
      responses:
        201:
          description: Hóa đơn được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        400:
          description: Dữ liệu không hợp lệ
        401:
          description: Không được xác thực

    get:
      summary: Lấy danh sách hóa đơn của người dùng
      description: Lấy danh sách hóa đơn; admin có thể xem tất cả
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực

  /invoices/subscription:
    post:
      summary: Tạo hóa đơn cho gói subscription
      description: "Tạo hóa đơn cho subscription plan (ví dụ: PLUS, VUP)"
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscriptionPlan
              properties:
                subscriptionPlan:
                  type: string
                  description: Mã gói subscription (PLUS, VUP...)
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn subscription được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/booking:
    post:
      summary: Tạo hóa đơn cho appointment (legacy booking endpoint repurposed)
      description: Hotels do not require prepayment; this endpoint now creates an invoice for an appointment. Truyền `appointmentId`.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appointmentId
              properties:
                appointmentId:
                  type: string
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn booking được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/cart:
    post:
      summary: Tạo hóa đơn từ giỏ hàng người dùng
      description: Tạo hóa đơn dựa trên giỏ hàng hiện tại của người dùng (không tự động xóa giỏ hàng)
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn cart được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

    /invoices/service:
      post:
        summary: Tạo hóa đơn cho một Service
        description: Tạo hóa đơn cho dịch vụ đã định nghĩa trong hệ thống (ví dụ cắt tỉa, khám bệnh). Truyền `serviceId` và `quantity` nếu cần.
        tags: [Invoices]
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - serviceId
                properties:
                  serviceId:
                    type: string
                  quantity:
                    type: integer
                    default: 1
                  currency:
                    type: string
                  dueDate:
                    type: string
                    format: date
        responses:
          201:
            description: Hóa đơn service được tạo
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Invoice'

  /invoices/{id}:
    get:
      summary: Lấy thông tin chi tiết hóa đơn
      description: Lấy chi tiết một hóa đơn theo ID
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn

  /invoices/{id}/status:
    get:
      summary: Lấy trạng thái hóa đơn
      description: Trả về trạng thái hiện tại của hóa đơn và thông tin payment liên quan (nếu có). Dùng để polling từ frontend.
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      payment:
                        type: object
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn

components:
  schemas:
    InvoiceItem:
      type: object
      properties:
        type:
          type: string
        refId:
          type: string
        description:
          type: string
        price:
          type: number

    Invoice:
      type: object
      properties:
        _id:
          type: string
        invoiceNumber:
          type: string
        user:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        subtotal:
          type: number
        total:
          type: number
        currency:
          type: string
        status:
          type: string
        payment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
