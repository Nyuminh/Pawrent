tags:
  - name: Invoices
    description: Quản lý hóa đơn (Invoices)

paths:
  /invoices:
    post:
      summary: Tạo hóa đơn mới
      description: Tạo một hóa đơn cho booking/appointment/subscription trước khi thực hiện thanh toán
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                user:
                  type: string
                  description: ID người dùng (nếu không truyền sẽ dùng user đang đăng nhập)
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Loại item (appointment|booking|subscription|product)
                      refId:
                        type: string
                        description: ID tham chiếu (ví dụ appointmentId)
                      description:
                        type: string
                      price:
                        type: number
                currency:
                  type: string
                  description: Mã tiền tệ (mặc định VND)
                paymentMethod:
                  type: string
                  enum: [cod, bank]
                  description: |
                    Phương thức thanh toán:
                    - `cod` — Thanh toán khi nhận hàng
                    - `bank` — Chuyển khoản ngân hàng
                  example: cod
      responses:
        201:
          description: Hóa đơn được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        400:
          description: Dữ liệu không hợp lệ
        401:
          description: Không được xác thực

    get:
      summary: Lấy danh sách hóa đơn của người dùng
      description: Lấy danh sách hóa đơn; admin có thể xem tất cả
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực

  /invoices/subscription:
    post:
      summary: Tạo hóa đơn cho gói subscription
      description: |
        Tạo hóa đơn cho các gói subscription:
        - **PLUS** — 49.000 VND/tháng
        - **VIP** — 499.000 VND/năm
        - **HOTEL_OWNER** — 2.000 VND (quản lý khách sạn)
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscriptionPlan
              properties:
                subscriptionPlan:
                  type: string
                  enum: [PLUS, VIP, HOTEL_OWNER]
                  description: Mã gói subscription
                  example: HOTEL_OWNER
                currency:
                  type: string
                  example: VND
            example:
              subscriptionPlan: HOTEL_OWNER
      responses:
        201:
          description: Hóa đơn subscription được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        400:
          description: Gói subscription không hợp lệ

  /invoices/booking:
    post:
      summary: Tạo hóa đơn cho appointment (legacy booking endpoint repurposed)
      description: Hotels do not require prepayment; this endpoint now creates an invoice for an appointment. Truyền `appointmentId`.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appointmentId
              properties:
                appointmentId:
                  type: string
                  description: ID của appointment
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn booking được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/cart:
    post:
      summary: Tạo hóa đơn từ giỏ hàng người dùng
      description: Tạo hóa đơn dựa trên giỏ hàng hiện tại của người dùng (không tự động xóa giỏ hàng)
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn cart được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/service:
    post:
      summary: Tạo hóa đơn cho một Service
      description: Tạo hóa đơn cho dịch vụ đã định nghĩa trong hệ thống (ví dụ cắt tỉa, khám bệnh). Truyền `serviceId` và `quantity` nếu cần.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceId
              properties:
                serviceId:
                  type: string
                quantity:
                  type: integer
                  default: 1
                currency:
                  type: string
      responses:
        201:
          description: Hóa đơn service được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/products:
    post:
      summary: Tạo hóa đơn từ các sản phẩm được chọn
      description: Truyền mảng `products` gồm `productId` và `quantity`, backend sẽ tự lấy giá từng sản phẩm và tính tổng tiền.
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products
              properties:
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - productId
                    properties:
                      productId:
                        type: string
                        description: ID sản phẩm
                      quantity:
                        type: integer
                        default: 1
                      color:
                        type: string
                        description: Màu sắc cụ thể của sản phẩm (không bắt buộc)
                        example: 'Đỏ'
                      size:
                        type: string
                        description: Kích thước cụ thể của sản phẩm (không bắt buộc)
                        example: 'M'
                currency:
                  type: string
                address:
                  type: string
                  description: Địa chỉ giao hàng/thanh toán
                dueDate:
                  type: string
                  format: date
                paymentMethod:
                  type: string
                  enum: [cod, bank]
                  description: Phương thức thanh toán
      responses:
        201:
          description: Hóa đơn products được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{id}:
    get:
      summary: Lấy thông tin chi tiết hóa đơn
      description: Lấy chi tiết một hóa đơn theo ID
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn
    delete:
      summary: Xóa hóa đơn theo ID
      description: Xóa một hóa đơn theo ID. Không cần phân quyền, chỉ cần xác thực.
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 6630f1b6f6d4e8a1c2b3d4e5
          description: ID hóa đơn cần xóa
      responses:
        200:
          description: Xóa hóa đơn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        401:
          description: Không được xác thực
        404:
          description: Không tìm thấy hóa đơn

  /invoices/{id}/status:
    get:
      summary: Lấy trạng thái hóa đơn
      description: Trả về trạng thái hiện tại của hóa đơn và thông tin payment liên quan (nếu có). Dùng để polling từ frontend.
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [pending, paid, cancelled, awaiting_confirmation]
                      payment:
                        type: object
        401:
          description: Không được xác thực
        403:
          description: Không có quyền truy cập
        404:
          description: Không tìm thấy hóa đơn

    patch:
      summary: Cập nhật trạng thái hóa đơn
      description: |
        Cập nhật trạng thái hóa đơn.
        - **Admin** có thể đặt bất kỳ trạng thái nào.
        - **User** chỉ được hủy hóa đơn của chính mình (`status: cancelled`).
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 6630f1b6f6d4e8a1c2b3d4e5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, paid, cancelled, awaiting_confirmation]
                  description: Trạng thái thanh toán của hóa đơn
                  example: cancelled
                orderStatus:
                  type: string
                  enum:
                    - awaiting_confirmation
                    - confirmed
                    - preparing
                    - shipping
                    - delivered
                    - completed
                    - cancelled
                    - return_requested
                    - returned
                  description: |
                    Trạng thái đơn hàng (dành cho đơn ship sản phẩm):
                    - `awaiting_confirmation` — Chờ xác nhận
                    - `confirmed` — Đã xác nhận
                    - `preparing` — Đang chuẩn bị hàng
                    - `shipping` — Đang vận chuyển
                    - `delivered` — Đã giao hàng
                    - `completed` — Hoàn thành
                    - `cancelled` — Đã hủy
                    - `return_requested` — Yêu cầu hoàn trả
                    - `returned` — Đã hoàn trả
                  example: shipping
            example:
              orderStatus: shipping
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật trạng thái hóa đơn thành công.
                  data:
                    $ref: '#/components/schemas/Invoice'
        400:
          description: Trạng thái không hợp lệ
        401:
          description: Không được xác thực
        403:
          description: Không có quyền cập nhật hóa đơn này
        404:
          description: Không tìm thấy hóa đơn

  /invoices/{id}/order-status:
    patch:
      summary: Cập nhật trạng thái đơn hàng (orderStatus)
      description: |
        Cập nhật trạng thái vận chuyển/xử lý của đơn hàng.

        **Phân quyền:**
        - Chỉ **admin** và **hotel_owner** được phép gọi API này.
        - User thường **không** được cập nhật.

        **Luồng trạng thái thông thường:**
        `awaiting_confirmation` → `confirmed` → `preparing` → `shipping` → `delivered` → `completed`
      tags: [Invoices]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 6630f1b6f6d4e8a1c2b3d4e5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderStatus
              properties:
                orderStatus:
                  type: string
                  enum:
                    - awaiting_confirmation
                    - confirmed
                    - preparing
                    - shipping
                    - delivered
                    - completed
                    - cancelled
                    - return_requested
                    - returned
                  description: |
                    Trạng thái đơn hàng:
                    - `awaiting_confirmation` — Chờ xác nhận
                    - `confirmed` — Đã xác nhận
                    - `preparing` — Đang chuẩn bị hàng
                    - `shipping` — Đang vận chuyển
                    - `delivered` — Đã giao hàng
                    - `completed` — Hoàn thành
                    - `cancelled` — Đã hủy
                    - `return_requested` — Yêu cầu hoàn trả
                    - `returned` — Đã hoàn trả
                  example: shipping
            example:
              orderStatus: shipping
      responses:
        200:
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật trạng thái đơn hàng thành công.
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      invoiceNumber:
                        type: string
                      orderStatus:
                        type: string
                        example: shipping
                      status:
                        type: string
                        example: awaiting_confirmation
                      updatedAt:
                        type: string
                        format: date-time
        400:
          description: orderStatus không hợp lệ
        401:
          description: Chưa đăng nhập
        403:
          description: Không có quyền (chỉ admin / hotel_owner)
        404:
          description: Không tìm thấy hóa đơn

components:
  schemas:
    InvoiceItem:
      type: object
      properties:
        type:
          type: string
          description: Loại item (appointment|booking|subscription|product)
        refId:
          type: string
          description: ID tham chiếu
        name:
          type: string
          description: Tên item (cho appointment sẽ hiển thị tên dịch vụ)
        price:
          type: number
        quantity:
          type: integer
        color:
          type: string
          description: Màu sắc sản phẩm (chỉ có với item loại product)
        size:
          type: string
          description: Kích thước sản phẩm (chỉ có với item loại product)

    Invoice:
      type: object
      properties:
        _id:
          type: string
        invoiceNumber:
          type: string
        user:
          type: object
          properties:
            _id:
              type: string
            fullName:
              type: string
            email:
              type: string
            phone:
              type: string
            address:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        subtotal:
          type: number
        tax:
          type: number
        discount:
          type: number
        total:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, cancelled, awaiting_confirmation]
          description: |
            Trạng thái thanh toán hóa đơn:
            - `pending` — Chờ thanh toán
            - `awaiting_confirmation` — Đã đặt COD, chờ xác nhận giao hàng
            - `paid` — Đã thanh toán
            - `cancelled` — Đã hủy
        orderStatus:
          type: string
          nullable: true
          enum:
            - awaiting_confirmation
            - confirmed
            - preparing
            - shipping
            - delivered
            - completed
            - cancelled
            - return_requested
            - returned
          description: |
            Trạng thái đơn hàng (dành cho đơn ship sản phẩm):
            - `awaiting_confirmation` — Chờ xác nhận
            - `confirmed` — Đã xác nhận
            - `preparing` — Đang chuẩn bị hàng
            - `shipping` — Đang vận chuyển
            - `delivered` — Đã giao hàng
            - `completed` — Hoàn thành
            - `cancelled` — Đã hủy
            - `return_requested` — Yêu cầu hoàn trả
            - `returned` — Đã hoàn trả
        paymentMethod:
          type: string
          nullable: true
          enum: [cod, bank]
          description: |
            Phương thức thanh toán:
            - `cod` — Thanh toán khi nhận hàng
            - `bank` — Chuyển khoản ngân hàng
          example: cod
        address:
          type: string
          description: Địa chỉ giao hàng/thanh toán
        appointment:
          type: object
          description: Chi tiết appointment nếu hóa đơn là cho appointment
        payment:
          type: string
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
