tags:
  - name: Pets
    description: Quản lý thú cưng
paths:
  /pets:
    get:
      summary: Lấy danh sách thú cưng của tôi
      tags: [Pets]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
    post:
      summary: Thêm thú cưng mới
      tags: [Pets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, species]
              properties:
                name:
                  type: string
                  description: Tên thú cưng (bắt buộc)
                species:
                  type: string
                  enum: [dog, cat, bird, hamster, rabbit, fish, other]
                  description: Loại thú cưng (bắt buộc)
                breed:
                  type: string
                  description: Giống
                gender:
                  type: string
                  enum: [male, female, unknown]
                  description: Giới tính
                dateOfBirth:
                  type: string
                  format: date
                  description: Ngày sinh (YYYY-MM-DD)
                weight:
                  type: number
                  description: Cân nặng (kg)
                color:
                  type: string
                  description: Màu sắc
                avatar:
                  type: string
                  description: URL ảnh đại diện
                microchipId:
                  type: string
                  description: ID vi điểm (microchip)
                isNeutered:
                  type: boolean
                  description: Đã triệt sản hay chưa
                allergies:
                  type: array
                  items:
                    type: string
                  description: Danh sách dị ứng
                specialNotes:
                  type: string
                  description: Ghi chú đặc biệt
                healthStatus:
                  type: string
                  enum: [healthy, sick, recovering, chronic]
                  description: Tình trạng sức khỏe
                trackingDevice:
                  type: object
                  description: Thiết bị định vị
                  properties:
                    deviceId:
                      type: string
                      description: ID thiết bị
                    isActive:
                      type: boolean
                      description: Có hoạt động hay không
      responses:
        201:
          description: Đã tạo thú cưng
  /pets/{id}:
    get:
      summary: Xem chi tiết thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
    put:
      summary: Cập nhật thông tin thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tên thú cưng
                species:
                  type: string
                  enum: [dog, cat, bird, hamster, rabbit, fish, other]
                  description: Loại thú cưng
                breed:
                  type: string
                  description: Giống
                gender:
                  type: string
                  enum: [male, female, unknown]
                  description: Giới tính
                dateOfBirth:
                  type: string
                  format: date
                  description: Ngày sinh (YYYY-MM-DD)
                weight:
                  type: number
                  description: Cân nặng (kg)
                color:
                  type: string
                  description: Màu sắc
                avatar:
                  type: string
                  description: URL ảnh đại diện
                microchipId:
                  type: string
                  description: ID vi điểm (microchip)
                isNeutered:
                  type: boolean
                  description: Đã triệt sản hay chưa
                allergies:
                  type: array
                  items:
                    type: string
                  description: Danh sách dị ứng
                specialNotes:
                  type: string
                  description: Ghi chú đặc biệt
                healthStatus:
                  type: string
                  enum: [healthy, sick, recovering, chronic]
                  description: Tình trạng sức khỏe
                trackingDevice:
                  type: object
                  description: Thiết bị định vị
                  properties:
                    deviceId:
                      type: string
                      description: ID thiết bị
                    isActive:
                      type: boolean
                      description: Có hoạt động hay không
                    lastLocation:
                      type: object
                      properties:
                        lat:
                          type: number
                        lng:
                          type: number
                        updatedAt:
                          type: string
                          format: date-time
      responses:
        200:
          description: Thành công
    delete:
      summary: Xóa thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Đã xóa
  /pets/{id}/location:
    get:
      summary: Lấy vị trí định vị
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Vị trí hiện tại
    put:
      summary: Cập nhật vị trí (từ thiết bị)
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
      responses:
        200:
          description: Cập nhật thành công
