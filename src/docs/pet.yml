tags:
  - name: Pets
    description: Quản lý thú cưng
paths:
  /pets:
    get:
      summary: Lấy danh sách thú cưng của tôi
      tags: [Pets]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
    post:
      summary: Thêm thú cưng mới
      tags: [Pets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, species]
              properties:
                name:
                  type: string
                  description: Tên thú cưng (bắt buộc)
                species:
                  type: string
                  enum: [dog, cat, bird, hamster, rabbit, fish, other]
                  description: Loại thú cưng (bắt buộc)
                breed:
                  type: string
                  description: Giống
                gender:
                  type: string
                  enum: [male, female, unknown]
                  description: Giới tính
                age:
                  type: number
                  description: Tuổi (năm)
                weight:
                  type: number
                  description: Cân nặng (kg)
                color:
                  type: string
                  description: Màu sắc
                avatar:
                  type: string
                  format: binary
                  description: Ảnh đại diện (JPEG, PNG, GIF, WebP - tối đa 5MB)
                isNeutered:
                  type: boolean
                  description: Đã triệt sản hay chưa
                allergies:
                  type: string
                  description: Danh sách dị ứng (JSON array string hoặc text)
                specialNotes:
                  type: string
                  description: Ghi chú đặc biệt
                healthStatus:
                  type: string
                  enum: [healthy, sick, recovering, chronic]
                  description: Tình trạng sức khỏe
      responses:
        201:
          description: Đã tạo thú cưng

  /pets/all:
    get:
      summary: Lấy danh sách tất cả thú cưng (Bác sĩ)
      tags: [Pets]
      security:
        - bearerAuth: []
      description: Cho phép bác sĩ thú y xem danh sách tất cả thú cưng trong hệ thống để chọn khi đặt lịch khám
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Trang (mặc định 1)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số bản ghi mỗi trang (mặc định 20, tối đa 100)
        - name: species
          in: query
          schema:
            type: string
            enum: [dog, cat, bird, hamster, rabbit, fish, other]
          description: Lọc theo loài thú cưng
        - name: owner
          in: query
          schema:
            type: string
          description: Lọc theo ID chủ nhân
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo tên hoặc giống
      responses:
        '200':
          description: Danh sách thú cưng
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        species:
                          type: string
                        breed:
                          type: string
                        owner:
                          type: object
                          properties:
                            _id:
                              type: string
                            fullName:
                              type: string
                            email:
                              type: string
                            phone:
                              type: string
        '403':
          description: Forbidden - Chỉ bác sĩ có thể truy cập
        '401':
          description: Unauthorized

  /pets/info/{id}:
    get:
      summary: Lấy thông tin thú cưng theo ID (Công khai)
      tags: [Pets]
      description: Lấy danh sách tất cả thú cưng (Bác sĩ)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của thú cưng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      species:
                        type: string
                      breed:
                        type: string
                      gender:
                        type: string
                      age:
                        type: number
                      weight:
                        type: number
                      color:
                        type: string
                      avatar:
                        type: string
                      isNeutered:
                        type: boolean
                      allergies:
                        type: array
                        items:
                          type: string
                      specialNotes:
                        type: string
                      healthStatus:
                        type: string
                      owner:
                        type: object
                        properties:
                          _id:
                            type: string
                          fullName:
                            type: string
                          phone:
                            type: string
                          email:
                            type: string
                          avatar:
                            type: string
        '404':
          description: Không tìm thấy thú cưng

  /pets/{id}:
    get:
      summary: Xem chi tiết thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
    put:
      summary: Cập nhật thông tin thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tên thú cưng
                species:
                  type: string
                  enum: [dog, cat, bird, hamster, rabbit, fish, other]
                  description: Loại thú cưng
                breed:
                  type: string
                  description: Giống
                gender:
                  type: string
                  enum: [male, female, unknown]
                  description: Giới tính
                age:
                  type: number
                  description: Tuổi (năm)
                weight:
                  type: number
                  description: Cân nặng (kg)
                color:
                  type: string
                  description: Màu sắc
                avatar:
                  type: string
                  format: binary
                  description: Ảnh đại diện (JPEG, PNG, GIF, WebP - tối đa 5MB)
                isNeutered:
                  type: boolean
                  description: Đã triệt sản hay chưa
                allergies:
                  type: string
                  description: Danh sách dị ứng (JSON array string hoặc text)
                specialNotes:
                  type: string
                  description: Ghi chú đặc biệt
                healthStatus:
                  type: string
                  enum: [healthy, sick, recovering, chronic]
                  description: Tình trạng sức khỏe
      responses:
        200:
          description: Thành công
    delete:
      summary: Xóa thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Đã xóa
  /pets/{id}/location:
    get:
      summary: Lấy vị trí định vị
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Vị trí hiện tại
    put:
      summary: Cập nhật vị trí (từ thiết bị)
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
      responses:
        200:
          description: Cập nhật thành công
