tags:
  - name: Pets
    description: Quản lý thú cưng
paths:
  /pets:
    get:
      summary: Lấy danh sách thú cưng của tôi
      tags: [Pets]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thành công
    post:
      summary: Thêm thú cưng mới
      tags: [Pets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, species]
              properties:
                name:
                  type: string
                species:
                  type: string
                  enum: [dog, cat, bird, hamster, rabbit, fish, other]
                breed:
                  type: string
                weight:
                  type: number
      responses:
        201:
          description: Đã tạo thú cưng
  /pets/{id}:
    get:
      summary: Xem chi tiết thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Thành công
    put:
      summary: Cập nhật thông tin thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Thành công
    delete:
      summary: Xóa thú cưng
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Đã xóa
  /pets/{id}/location:
    get:
      summary: Lấy vị trí định vị
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Vị trí hiện tại
    put:
      summary: Cập nhật vị trí (từ thiết bị)
      tags: [Pets]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
      responses:
        200:
          description: Cập nhật thành công
