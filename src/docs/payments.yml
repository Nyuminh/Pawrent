tags:
  - name: Payments
    description: Thanh toán và cổng thanh toán SePay

paths:
  /payments/sepay/checkout/init:
    post:
      summary: Tạo đơn thanh toán SePay
      description: Tạo payment pending, sinh QR và trang trung gian để chuyển sang SePay checkout. Frontend phải truyền đầy đủ `successUrl`, `errorUrl` và `cancelUrl`; backend không còn tự gán URL mặc định.
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoiceId
                - successUrl
                - errorUrl
                - cancelUrl
              properties:
                invoiceId:
                  type: string
                  description: ID hóa đơn cần thanh toán
                  example: 6630f1b6f6d4e8a1c2b3d4e5
                successUrl:
                  type: string
                  format: uri
                  description: URL FE nhận callback khi thanh toán thành công
                  example: https://pawrent.example.com/payments/sepay/success
                errorUrl:
                  type: string
                  format: uri
                  description: URL FE nhận callback khi thanh toán lỗi
                  example: https://pawrent.example.com/payments/sepay/error
                cancelUrl:
                  type: string
                  format: uri
                  description: URL FE nhận callback khi người dùng hủy thanh toán
                  example: https://pawrent.example.com/payments/sepay/cancel
              example:
                invoiceId: 6630f1b6f6d4e8a1c2b3d4e5
                successUrl: https://pawrent.example.com/payments/sepay/success
                errorUrl: https://pawrent.example.com/payments/sepay/error
                cancelUrl: https://pawrent.example.com/payments/sepay/cancel
      responses:
        201:
          description: Tạo payment thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  paymentId:
                    type: string
                  provider:
                    type: string
                  amount:
                    type: number
                  checkoutPageUrl:
                    type: string
                    description: URL trang trung gian SePay checkout, QR này chỉ dẫn tới trang thanh toán.
                  qrDataUrl:
                    type: string
                    description: QR code của checkoutPageUrl, không phải QR chuyển khoản ngân hàng trực tiếp.
                  qrImageUrl:
                    type: string
                    description: Ảnh PNG của QR checkoutPageUrl.
                  statusUrl:
                    type: string
        400:
          description: Dữ liệu không hợp lệ
        401:
          description: Không được xác thực
        500:
          description: Thiếu cấu hình SePay

  /payments/sepay/checkout/{paymentId}:
    get:
      summary: Mở trang trung gian chuyển hướng sang SePay
      description: Trang HTML tự submit form sang SePay checkout endpoint.
      tags: [Payments]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML auto-submit form
          content:
            text/html:
              schema:
                type: string
        404:
          description: Không tìm thấy payment
        500:
          description: SePay chưa được cấu hình

  /payments/sepay/status/{paymentId}:
    get:
      summary: Kiểm tra trạng thái payment SePay
      description: Endpoint polling để frontend kiểm tra payment đã paid/failed hay chưa.
      tags: [Payments]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Trạng thái payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      provider:
                        type: string
                      status:
                        type: string
                        example: pending
                      amount:
                        type: number
                      currency:
                        type: string
                      checkoutUrl:
                        type: string
                      qrDataUrl:
                        type: string
                      invoiceId:
                        type: string
                      updatedAt:
                        type: string
                        format: date-time
        404:
          description: Không tìm thấy payment

  /payments/sepay/return/{result}:
    get:
      summary: Trang callback trả về cho khách hàng
      description: Trang hiển thị kết quả và tự polling trạng thái payment.
      tags: [Payments]
      parameters:
        - name: result
          in: path
          required: true
          schema:
            type: string
            enum: [success, error, cancel]
        - name: paymentId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML trang kết quả thanh toán
          content:
            text/html:
              schema:
                type: string
        400:
          description: Thiếu paymentId

  /payments/sepay/webhook:
    post:
      summary: IPN webhook từ SePay
      description: SePay gọi vào endpoint này để thông báo giao dịch và cập nhật trạng thái payment/hóa đơn.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: integer
                notification_type:
                  type: string
                  example: ORDER_PAID
                order:
                  type: object
                transaction:
                  type: object
                customer:
                  type: object
                agreement:
                  type: object
      responses:
        200:
          description: Đã ghi nhận IPN
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /payments/invoice/{invoiceId}:
    get:
      summary: Lấy thông tin thanh toán theo hóa đơn
      description: Lấy chi tiết payment liên quan đến một hóa đơn cụ thể. Người dùng chỉ có thể xem payment của hóa đơn của chính mình, admin có thể xem tất cả.
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            example: 6630f1b6f6d4e8a1c2b3d4e5
          description: ID hóa đơn
      responses:
        200:
          description: Lấy payment thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      user:
                        type: string
                      amount:
                        type: number
                      currency:
                        type: string
                        example: VND
                      provider:
                        type: string
                        example: sepay
                      status:
                        type: string
                        enum: [pending, paid, failed]
                      providerPaymentId:
                        type: string
                      checkoutUrl:
                        type: string
                      qrUrl:
                        type: string
                      metadata:
                        type: object
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        403:
          description: Không có quyền xem hóa đơn này
        404:
          description: Không tìm thấy hóa đơn hoặc payment
