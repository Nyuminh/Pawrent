tags:
  - name: Firebase
    description: API tích hợp thông tin dịch vụ nền tảng Firebase (Google Login, Storage, FCM, Crashlytics)

paths:
  /firebase/login:
    post:
      tags:
        - Firebase
      summary: Đăng nhập bằng Google qua Firebase
      description: Nhận ID Token từ phía client sau khi người dùng thực hiện đăng nhập qua Firebase Auth, tiến hành xác thực và trả về Token truy cập của hệ thống. Đồng thời lưu trữ FCM token cho chức năng Push Notification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Google ID Token nhận được sau khi login Firebase.
                fcmToken:
                  type: string
                  description: Cloud Messaging Token dùng cho việc nhận push notification (tuỳ chọn).
      responses:
        '200':
          description: Đăng nhập thành công và trả về thông tin user cùng accessToken.
        '400':
          description: Vui lòng cung cấp Google ID Token.
        '401':
          description: Xác thực Firebase thất bại hoặc token không hợp lệ (hết hạn).

  /firebase/upload:
    post:
      tags:
        - Firebase
      summary: Upload file lên Firebase Storage
      description: Upload avatar hoặc file media bất kỳ lên Firebase Storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File ảnh/video cần upload.
      responses:
        '200':
          description: Upload file thành công và lấy public URL.
        '400':
          description: Chưa cung cấp file hơp lệ.
        '500':
          description: Lỗi máy chủ hoặc Firebase Storage chặn kết nối.

  /firebase/send-notification:
    post:
      tags:
        - Firebase
      summary: Gửi thông báo Push Notification (Cloud Messaging)
      description: Admin hoặc hệ thống sử dụng API này để gửi thông báo FCM theo userId. FCM Tokens đã được lưu vào mảng `fcmTokens` của user khi họ login/cập nhật.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - title
                - body
              properties:
                userId:
                  type: string
                  description: ID của User cần gửi thông báo
                title:
                  type: string
                  description: Tiêu đề thông báo
                body:
                  type: string
                  description: Nội dung thông báo
                data:
                  type: object
                  description: Payload kèm dữ liệu ẩn (tùy chọn).
      responses:
        '200':
          description: Yêu cầu gửi notification thành công.
        '404':
          description: Không tìm thấy User hoặc người dùng chưa có thiết bị đăng ký nhận thông báo (Không có fcmToken).
        '500':
          description: Lỗi khi tương tác Firebase.

  /firebase/send-notification-all:
    post:
      tags:
        - Firebase
      summary: Phát sóng Push Notification (Broadcast toàn bộ hệ thống)
      description: Gửi thông báo đến TẤT CẢ các thiết bị đang có trên hệ thống (Sử dụng cơ chế Multicast tự động tách lô 500 token không dội server).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
              properties:
                title:
                  type: string
                  description: Tiêu đề thông báo
                  example: "Hệ thống bảo trì"
                body:
                  type: string
                  description: Nội dung thông báo
                  example: "Ứng dụng sẽ bảo trì vào 12h đêm nay."
                data:
                  type: object
                  description: Payload truyền thêm.
      responses:
        '200':
          description: Gửi thành công
        '404':
          description: Không có token nào trên hệ thống
        '500':
          description: Lỗi máy chủ

  /firebase/log-crash:
    post:
      tags:
        - Firebase
      summary: Ghi nhận log crash
      description: Ghi nhận lỗi gặp phải từ phía client truyền lên. Note - Firebase Crashlytics là SDK tích hợp ở Client (không có API cho BE) nên hàm này nhận log hỗ trợ tracking thêm.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Chi tiết Error / Exception.
                platform:
                  type: string
                  description: Môi trường (Android/iOS/Web).
                route:
                  type: string
                  description: Màn hình gặp lỗi.
                userId:
                  type: string
                  description: ID người thao tác dính lỗi.
      responses:
        '200':
          description: Server đã tiếp nhận và ghi console log.

  /firebase/users:
    get:
      tags:
        - Firebase
      summary: Lấy danh sách người dùng từ Firebase Auth
      description: |
        Sử dụng Firebase Admin SDK để liệt kê tất cả tài khoản đang tồn tại trên Firebase Authentication.

        **Phân quyền:** Chỉ `admin` mới được gọi API này.

        **Phân trang (Cursor-based):**
        - Mỗi lần gọi trả về tối đa `limit` user (mặc định 100, tối đa 1000).
        - Nếu response có `nextPageToken`, truyền nó vào query param `?pageToken=...` để lấy trang tiếp theo.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Số lượng user mỗi trang (tối đa 1000)
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: pageToken
          in: query
          description: Token để lấy trang tiếp theo (lấy từ nextPageToken của response trước)
          schema:
            type: string
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    description: Số lượng user trong trang này
                    example: 50
                  nextPageToken:
                    type: string
                    nullable: true
                    description: Token để gọi trang tiếp theo (null nếu đã hết)
                    example: "eyJhbGciOi..."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                          example: "abc123xyz"
                        email:
                          type: string
                          nullable: true
                          example: "user@gmail.com"
                        displayName:
                          type: string
                          nullable: true
                          example: "Nguyễn Văn A"
                        photoURL:
                          type: string
                          nullable: true
                        phoneNumber:
                          type: string
                          nullable: true
                        emailVerified:
                          type: boolean
                          example: true
                        disabled:
                          type: boolean
                          example: false
                        createdAt:
                          type: string
                          format: date-time
                        lastSignedIn:
                          type: string
                          format: date-time
                        providerData:
                          type: array
                          items:
                            type: object
                            properties:
                              providerId:
                                type: string
                                example: "google.com"
                              email:
                                type: string
                              displayName:
                                type: string
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền (chỉ admin)
        '500':
          description: Lỗi Firebase Admin SDK

  /firebase/users/{uid}/status:
    put:
      tags:
        - Firebase
      summary: Vô hiệu hóa (Disable) hoặc Mở khóa tài khoản Firebase User
      description: Cho phép Admin thay đổi trạng thái khóa/mở khóa của một tài khoản trên Firebase Auth.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: UID của tài khoản trên Firebase
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - disabled
              properties:
                disabled:
                  type: boolean
                  description: Truyền `true` để khóa tài khoản, `false` để mở khóa.
                  example: true
      responses:
        '200':
          description: Thay đổi trạng thái thành công
        '400':
          description: Dữ liệu gửi lên không đúng định dạng bool
        '500':
          description: Lỗi hệ thống

  /firebase/users/{uid}:
    delete:
      tags:
        - Firebase
      summary: Xóa vĩnh viễn Firebase User
      description: Xóa hoàn toàn một tài khoản khỏi hệ thống Firebase Authentication (Không thể hoàn tác).
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          description: UID của tài khoản cần xóa
          schema:
            type: string
      responses:
        '200':
          description: Đã xóa tài khoản thành công
        '500':
          description: Lỗi máy chủ

  /firebase/remote-config:
    get:
      tags:
        - Firebase
      summary: Lấy Remote Config Template
      description: Lấy trực tiếp thông tin cấu hình Remote Config đang chạy để xem hoặc debug phía Client.
      security: []
      responses:
        '200':
          description: Lấy Remote config thành công
        '500':
          description: Lỗi máy chủ

    put:
      tags:
        - Firebase
      summary: Cập nhật & Publish Remote Config
      description: Nhận Body JSON để thay đổi (hoặc thêm mới) giá trị tham số cấu hình (vd như `app_theme_event`). Sau đó API sẽ tự động lưu và Publish toàn bộ Template lên Firebase lập tức.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                app_theme_event: "TET"
      responses:
        '200':
          description: Cập nhật và Publish thành công
        '400':
          description: Data body trống
        '500':
          description: Lỗi khi thao tác Firebase Admin SDK

  /firebase/fcm-board:
    get:
      tags:
        - Firebase
      summary: Lấy dữ liệu báo cáo thống kê FCM (Dashboard)
      description: API trả về số liệu mock giống hệt trang Messaging Reports của Firebase để Flutter hiển thị.
      security: []
      responses:
        '200':
          description: Đã lấy thông tin thành công
        '500':
          description: Lỗi máy chủ

  /firebase/analytics:
    get:
      tags:
        - Firebase
      summary: Lấy dữ liệu Realtime Analytics thực tế
      description: Kết nối trực tiếp với Google Analytics Data API để lấy số lượng User Active theo Real-time chia theo từng City. Yêu cầu truyền `GA4_PROPERTY_ID` trong server config (.env).
      security: []
      responses:
        '200':
          description: Truy xuất dữ liệu Realtime thành công
        '400':
          description: Thiếu cấu hình GA4_PROPERTY_ID
        '500':
          description: Lỗi kết nối Google Analytics Data API


